<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ARTIFACT-BODY-START -->
<title>Pathfinder Class Codex</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E7E7EA; --surface:#FCFCFD; --surface-2:#F1F1F4; --surface-3:#E1E0E6;
  --ink:#191922; --ink-2:#55535F; --ink-3:#84828F;
  --line:#D2D1D8; --line-strong:#BBB9C4;
  --accent:#C2402C; --accent-ink:#A0331F; --accent-soft:rgba(194,64,44,.10);
  --brass:#97721F; --brass-soft:rgba(151,114,31,.14);
  --track:#DBDAE1;
  --shadow:0 1px 2px rgba(20,18,30,.06),0 8px 24px rgba(20,18,30,.08);
  --r:10px;
  --ax-melee:#C0392B; --ax-ranged:#CC6A1B; --ax-defenses:#2E6F9E; --ax-magic:#8C4FB0;
  --ax-support:#12897F; --ax-healing:#4A8F32; --ax-skills:#A8821B; --ax-questing:#B03E72;
  --ax-popularity:#5B6478; --ax-difficulty:#87828F;
  --f-disp:"Alegreya",Georgia,"Times New Roman",serif;
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121218; --surface:#1B1B22; --surface-2:#22222B; --surface-3:#2B2B35;
    --ink:#ECEBF2; --ink-2:#A6A4B3; --ink-3:#7A7889;
    --line:#31313C; --line-strong:#41414E;
    --accent:#E8674D; --accent-ink:#F0836C; --accent-soft:rgba(232,103,77,.14);
    --brass:#D5A94C; --brass-soft:rgba(213,169,76,.16);
    --track:#2C2C36;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --ax-melee:#E2695A; --ax-ranged:#EA9440; --ax-defenses:#5A9DCE; --ax-magic:#B37BD8;
    --ax-support:#2FBDB0; --ax-healing:#6CC85D; --ax-skills:#D8B043; --ax-questing:#DE6E9B;
    --ax-popularity:#8B94AB; --ax-difficulty:#ABA6B4;
  }
}
:root[data-theme="dark"]{
  --bg:#121218; --surface:#1B1B22; --surface-2:#22222B; --surface-3:#2B2B35;
  --ink:#ECEBF2; --ink-2:#A6A4B3; --ink-3:#7A7889;
  --line:#31313C; --line-strong:#41414E;
  --accent:#E8674D; --accent-ink:#F0836C; --accent-soft:rgba(232,103,77,.14);
  --brass:#D5A94C; --brass-soft:rgba(213,169,76,.16);
  --track:#2C2C36;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --ax-melee:#E2695A; --ax-ranged:#EA9440; --ax-defenses:#5A9DCE; --ax-magic:#B37BD8;
  --ax-support:#2FBDB0; --ax-healing:#6CC85D; --ax-skills:#D8B043; --ax-questing:#DE6E9B;
  --ax-popularity:#8B94AB; --ax-difficulty:#ABA6B4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:760px;margin:0 auto;padding:0 0 88px}

/* ---------- masthead ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--line);padding:14px 16px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-disp);font-weight:800;font-size:26px;line-height:1.05;
  margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:12px}
.tab{flex:1;padding:10px 8px 11px;font-size:13px;font-weight:600;text-align:center;
  color:var(--ink-3);border-bottom:2px solid transparent;letter-spacing:.02em}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-left:4px}

/* ---------- controls ---------- */
.controls{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:0 10px}
.search input{flex:1;border:0;background:none;padding:10px 0;font:inherit;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search svg{flex:none;color:var(--ink-3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border:1px solid var(--line-strong);border-radius:999px;
  font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--f-mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.05em;text-transform:uppercase}
.sortbar select{font:inherit;font-family:var(--f-ui);font-size:12.5px;text-transform:none;
  letter-spacing:0;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:5px 8px}

/* ---------- list ---------- */
.list{margin-top:6px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row .nm{font-family:var(--f-disp);font-weight:700;font-size:19px;line-height:1.15;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row .tl{color:var(--ink-2);font-size:13px;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.badge{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-2);border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px}
.badge.k{border-color:var(--accent);color:var(--accent)}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:5px 12px;margin-top:12px}
.pf .c{display:grid;grid-template-columns:14px 58px minmax(0,1fr) 13px;gap:5px;
  align-items:center;height:18px}
.pf .ic{width:13px;height:13px;display:block}
.pf .n{font-size:10.5px;color:var(--ink-2);line-height:1;white-space:nowrap}
.pf .b{height:9px;border-radius:2px;overflow:hidden;
  background:repeating-linear-gradient(to right,var(--track) 0 calc(20% - 1px),var(--bg) calc(20% - 1px) 20%)}
.pf .b i{display:block;height:100%;border-radius:2px}
.pf .v{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--ink-2);
  font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.star{flex:none;width:40px;height:40px;display:grid;place-items:center;
  border-radius:999px;color:var(--ink-3);align-self:start}
.star[aria-pressed="true"]{color:var(--brass);background:var(--brass-soft)}
.star svg{width:21px;height:21px}
.rowopen{display:block;width:100%;text-align:left;background:none;border:0;padding:0;
  font:inherit;color:inherit;cursor:pointer;min-width:0}
.rowopen:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;font-family:var(--f-disp);font-size:20px;color:var(--ink);margin-bottom:6px}
</style>
<style>
/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;padding:12px 16px;
  font-size:13px;font-weight:600;color:var(--accent)}
.detail{padding:0 16px}
.dhead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;
  padding-bottom:14px;border-bottom:2px solid var(--ink)}
.dhead h2{font-family:var(--f-disp);font-weight:800;font-size:34px;line-height:1;
  margin:0 0 6px;letter-spacing:-.015em;text-wrap:balance}
.dhead .src{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}
.dhead .tag{font-family:var(--f-disp);font-style:italic;font-size:17px;
  color:var(--ink-2);margin-top:8px;line-height:1.35;max-width:60ch}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:16px 0}
.statgrid div{background:var(--surface);padding:9px 11px}
.statgrid dt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin:0}
.statgrid dd{margin:2px 0 0;font-size:13.5px;font-weight:500;line-height:1.3}
@media(min-width:560px){.statgrid{grid-template-columns:repeat(3,1fr)}}

.sec{margin:26px 0 0}
.sec > h3{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);margin:0 0 10px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.bullets li{padding-left:16px;position:relative;font-size:14.5px;line-height:1.55}
.bullets li::before{content:"";position:absolute;left:0;top:.72em;width:9px;height:2px;
  background:var(--line-strong);border-radius:1px}
.bullets b{font-weight:600}
.act{font-family:var(--f-mono);font-size:.85em;color:var(--accent);
  letter-spacing:-.04em;padding:0 2px;white-space:nowrap}
.dtbody{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink);
  padding:13px 15px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--ax-questing)}
.verdict{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.verdict p{margin:0;padding:11px 13px;border-radius:var(--r);font-size:14px;line-height:1.5;
  border-left:3px solid}
.verdict .yes{background:var(--accent-soft);border-color:var(--accent)}
.verdict .no{background:var(--surface-2);border-color:var(--line-strong)}
.verdict strong{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;display:block;margin-bottom:3px;color:var(--ink-2)}
.verdict .yes strong{color:var(--accent)}

/* ---------- score bars ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:16px 96px 1fr 40px;gap:9px;align-items:center}
.bar .ic{width:15px;height:15px;display:block}
.bar .lb{font-size:12.5px;color:var(--ink);line-height:1.2}
.bar .lb em{font-style:normal;font-family:var(--f-mono);font-size:8.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:block;margin-top:1px}
.bar .tk{height:10px;border-radius:2px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(to right,var(--track) 0 calc(20% - 1px),var(--bg) calc(20% - 1px) 20%)}
.bar .tk i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px;display:block}
.bar .vl{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);white-space:nowrap;
  text-align:right;font-variant-numeric:tabular-nums}
.axhelp{font-size:12px;color:var(--ink-3);margin:14px 0 0;line-height:1.45}
.axhelp b{color:var(--ink-2);font-weight:600}

/* ---------- compare ---------- */
.cmp{padding:0 0 20px}
.cmp-intro{padding:14px 16px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:12px 16px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.legend i{width:10px;height:10px;border-radius:2px;display:block;flex:none}
.axblock{padding:16px}
.ax{margin-bottom:14px}
.ax > h4{margin:0 0 5px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.ax > h4 .ic{width:14px;height:14px;flex:none}
.ax > h4 span{flex:1}
.ax > h4 em{font-style:normal;color:var(--ink-3);font-size:9px}
.grp{display:flex;flex-direction:column;gap:3px}
.grp .g{display:grid;grid-template-columns:1fr 22px;gap:7px;align-items:center}
.grp .gt{height:12px;border-radius:2px;overflow:hidden;
  background:repeating-linear-gradient(to right,var(--track) 0 calc(20% - 1px),var(--bg) calc(20% - 1px) 20%)}
.grp .gt i{display:block;height:100%;border-radius:2px}
.grp .gv{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);
  text-align:right;font-variant-numeric:tabular-nums}

.tblwrap{overflow-x:auto;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
table.cmpt{border-collapse:collapse;font-size:13px;min-width:100%}
table.cmpt th,table.cmpt td{border-bottom:1px solid var(--line);
  padding:9px 11px;vertical-align:top;text-align:left}
table.cmpt tbody th{position:sticky;left:0;z-index:2;background:var(--surface-2);
  width:96px;min-width:96px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500;
  border-right:1px solid var(--line)}
table.cmpt thead th{position:sticky;top:0;background:var(--surface);z-index:3;
  min-width:172px;font-family:var(--f-disp);font-size:17px;font-weight:700;
  border-bottom:2px solid var(--ink)}
table.cmpt thead th:first-child{left:0;z-index:4;background:var(--surface-2);
  min-width:96px;width:96px;border-right:1px solid var(--line)}
table.cmpt thead th .swatch{display:block;height:3px;border-radius:2px;margin-bottom:6px}
table.cmpt td{min-width:172px;line-height:1.45;color:var(--ink-2)}
table.cmpt td.hi{color:var(--ink);font-weight:500}
table.cmpt ul{margin:0;padding-left:15px}
table.cmpt li{margin-bottom:4px}
.scrollhint{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);padding:8px 16px 0}

/* ---------- about ---------- */
.about{margin:30px 16px 0;padding:16px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r)}
.about h3{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 10px}
.about p{margin:0 0 10px;font-size:13px;line-height:1.55;color:var(--ink-2)}
.about p:last-child{margin-bottom:0}
.about b{color:var(--ink);font-weight:600}
.about a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.langlink{border-top:1px solid var(--line);padding-top:10px;margin-top:12px!important}
.ax-key{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:9px}
.ax-key span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink)}
.ax-key svg{width:14px;height:14px;flex:none}
.note{border-left:3px solid var(--brass);background:var(--brass-soft);
  padding:11px 13px;border-radius:0 var(--r) var(--r) 0;margin:0 0 14px}
.note p{color:var(--ink);margin:0;font-size:13px;line-height:1.5}
.note strong{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--brass);display:block;margin-bottom:3px}
.hidden{display:none!important}
</style>

<style>
/* ---------- bilingual + homebrew additions ---------- */
.brand .right{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;flex:none}
.lang button{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:4px 8px;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row .ennm{font-family:var(--f-ui);font-size:11.5px;font-weight:400;color:var(--ink-3)}
.dhead .enname{font-size:12px;color:var(--ink-3);margin-top:6px}
.dhead .enname b{color:var(--ink-2);font-weight:600}
.badge.hb{border-color:var(--brass);color:var(--brass)}
.badge.cn{border-style:dashed;border-color:var(--brass);color:var(--brass)}
.chips .sep{flex:none;width:1px;background:var(--line-strong);margin:3px 2px}
.pf .b.unk,.bar .tk.unk,.grp .gt.unk{background:repeating-linear-gradient(135deg,var(--track) 0 3px,var(--bg) 3px 6px)}
html[lang="es"] .pf{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
html[lang="es"] .pf .c{grid-template-columns:14px 82px minmax(0,1fr) 13px;gap:4px}
html[lang="es"] .pf .n{font-size:10px}
html[lang="es"] .bar{grid-template-columns:16px 112px 1fr 40px}
html[lang="es"] table.cmpt tbody th,html[lang="es"] table.cmpt thead th:first-child{width:104px;min-width:104px}
@media (max-width:380px){.brand h1{font-size:22px}.brand .n{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 id="h1">Pathfinder Class Codex</h1>
      <div class="right">
        <span class="n" id="rosterN"></span>
        <div class="lang" role="group" aria-label="Language / Idioma">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="es" aria-pressed="false">ES</button>
        </div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabBrowse" aria-selected="true"></button>
      <button class="tab" role="tab" id="tabCompare" aria-selected="false"><span id="tabCompareLbl"></span><span class="cnt" id="favCnt">0</span></button>
    </div>
  </header>

  <section id="viewBrowse">
    <div class="controls">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" autocomplete="off">
      </label>
      <div class="chips" id="chips"></div>
      <div class="sortbar">
        <span id="resultN"></span>
        <label><span id="sortLbl"></span> <select id="sort"></select></label>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="about" id="about"></div>
  </section>

  <section id="viewDetail" class="hidden">
    <button class="back" id="back"></button>
    <div class="detail" id="detailBody"></div>
  </section>

  <section id="viewCompare" class="hidden">
    <div class="cmp" id="cmpBody"></div>
  </section>
</div>
<script>
"use strict";
var MAX=5;
var CLASSES=[{"id":"alchemist","hb":0,"type":"Hybrid","roles":["Support","Utility","Striker"],"s":{"melee":2,"ranged":3,"defenses":3,"magic":0,"support":5,"healing":4,"skills":4,"questing":3,"popularity":2,"difficulty":5},"en":{"name":"Alchemist","src":"Player Core 2","rarity":"Common","hp":"8","key":"Intelligence","cast":"None &mdash; alchemy, not spells","armor":"Light &amp; medium","sub":"Research Field","tag":"A walking laboratory who wins fights by having already made the right thing this morning.","mech":["You do not cast, you <b>craft</b>. During daily preparations, <b>Advanced Alchemy</b> turns your formula book into a batch of infused elixirs, bombs, mutagens and poisons &mdash; free, yours, and gone again at your next preparation.","<b>Versatile vials</b> are the improvisation budget: throw them as bombs, or spend one on <span class=\"act\">&#9670;</span> <b>Quick Alchemy</b> to conjure any formula you know on the spot, at the cost of the item fizzling out almost immediately.","Your <b>Research Field</b> &mdash; Bomber, Chirurgeon, Mutagenist, Toxicologist &mdash; decides whether that engine points at blowing things up, healing and curing, reshaping your own body, or poisoning.","Your <b>class DC</b> governs the saves against your bombs and elixirs, so Intelligence is doing double duty as your attack stat and your skill stat.","Crafting is a core combat competency here, not a background skill, and the class scales by making your vials more potent rather than by learning new spells."],"rp":["You are the party's mad scientist: fearless about risk, endlessly curious about what a thing does, and always tinkering with something.","Socially you are the person who knows far too much about poisons and diseases &mdash; useful, and faintly alarming.","People routinely mistake you for a wizard, which irritates you, or assume you are one bad experiment away from disaster, which is harder to argue with."],"dt":"Idle hours are lab hours. Between adventures you are bent over a workbench brewing elixirs and packing bombs, refining old formulas and chasing new ones &mdash; downtime is simply more research time, not rest.","yes":"You like inventory as a puzzle, want an answer to nearly any situation, and enjoy being the person who says \"hold on, I made one of those.\"","no":"You want to open your sheet and hit something. The alchemist has more moving parts than any other class in the game."},"es":{"name":"Alquimista","src":"Player Core 2","rarity":"Común","hp":"8","key":"Inteligencia","cast":"Ninguno — alquimia, no conjuros","armor":"Ligera y media","sub":"Campo de investigación","tag":"Un laboratorio con piernas que gana los combates por haber fabricado esta mañana justo lo que hacía falta.","mech":["No lanzas conjuros: <b>fabricas</b>. Durante las preparaciones diarias, la <b>Alquimia avanzada</b> convierte tu formulario en un lote de elixires, bombas, mutágenos y venenos infundidos: gratuitos, tuyos, y desaparecen en la siguiente preparación.","Los <b>viales versátiles</b> son tu presupuesto de improvisación: lánzalos como bombas o gasta uno en <span class=\"act\">&#9670;</span> <b>Alquimia rápida</b> para crear al instante cualquier fórmula que conozcas, a cambio de que el objeto se agote enseguida.","Tu <b>campo de investigación</b> —Bombardero, Cirujano, Mutagenista o Toxicólogo— decide si ese motor apunta a volar cosas por los aires, curar, remodelar tu propio cuerpo o envenenar.","Tu <b>CD de clase</b> gobierna las salvaciones contra tus bombas y elixires, así que la Inteligencia te sirve a la vez de atributo ofensivo y de habilidad.","Aquí Fabricar es una competencia de combate, no una habilidad de trasfondo, y la clase escala haciendo más potentes tus viales en vez de dándote conjuros nuevos."],"rp":["Eres el científico loco del grupo: sin miedo al riesgo, con una curiosidad inagotable por saber qué hace cada cosa, y siempre trasteando con algo.","En lo social eres quien sabe demasiado sobre venenos y enfermedades: útil, y ligeramente inquietante.","La gente te confunde constantemente con un mago, cosa que te irrita, o da por hecho que estás a un experimento fallido del desastre, que cuesta más rebatir."],"dt":"Tus ratos muertos son horas de laboratorio. Entre aventuras estás inclinado sobre la mesa de trabajo preparando elixires y montando bombas, refinando fórmulas viejas y persiguiendo nuevas: el tiempo libre es más investigación, no descanso.","yes":"Te gusta el inventario como rompecabezas, quieres una respuesta para casi cualquier situación y disfrutas siendo quien dice «espera, tengo una de esas».","no":"Quieres abrir la hoja de personaje y golpear algo. El alquimista tiene más piezas móviles que ninguna otra clase del juego."}},{"id":"animist","hb":0,"type":"Caster","roles":["Support","Controller"],"s":{"melee":2,"ranged":3,"defenses":3,"magic":4,"support":3,"healing":4,"skills":3,"questing":2,"popularity":4,"difficulty":5},"en":{"name":"Animist","src":"War of Immortals","rarity":"Common","hp":"8","key":"Wisdom","cast":"Divine (prepared + spontaneous)","armor":"Light","sub":"Apparitions","tag":"A medium who bonds with spirits too insubstantial to touch the world, and lends them a body.","mech":["Each day you attune to two <b>apparitions</b> &mdash; later three, then four &mdash; and name one primary. They are spirits that cannot affect the physical world without you.","This gives an unusual double engine: you <b>prepare</b> divine spells like a small cleric, and separately gain a pool of <b>spontaneous</b> spells drawn from whichever apparitions you are attuned to today.","Your primary apparition grants a unique focus <b>vessel spell</b>, and eventually the ability to transform into that spirit's <b>avatar</b>.","Because attunement resets each morning, your toolkit genuinely changes day to day &mdash; a ghost-warrior spirit plays nothing like a spirit of knowledge.","It rewards players who enjoy reading a menu of options at breakfast and building the day around what the adventure seems to need."],"rp":["You are a bridge between the mortal and spiritual worlds &mdash; part counselor, part medium, part diplomat for things nobody else can perceive.","You talk to, and sometimes <i>for</i>, entities others cannot see. Playing it well means letting the apparition colour your voice and what you notice.","Thinking in stories and long timescales can read as detached or aloof, even while you are deeply attuned to the people around you."],"dt":"You gravitate to wherever your attuned spirits are strongest or most at peace &mdash; tending grave sites, walking old wilderness, or spending long stretches on rivers and seas. Animists bonded to spirits of wisdom instead haunt libraries and temples, deepening the scholarly side of the bond.","yes":"You want prepared and spontaneous casting at once, and a character with company inside their own head.","no":"You want a straightforward caster. Two spell engines plus a daily attunement choice is a lot of surface area."},"es":{"name":"Animista","src":"War of Immortals","rarity":"Común","hp":"8","key":"Sabiduría","cast":"Divina (preparada + espontánea)","armor":"Ligera","sub":"Apariciones","tag":"Un médium que se vincula con espíritus demasiado etéreos para tocar el mundo, y les presta un cuerpo.","mech":["Cada día te sintonizas con dos <b>apariciones</b> —más tarde tres, luego cuatro— y designas una como principal. Son espíritus que no pueden afectar al mundo físico sin ti.","Eso te da un doble motor poco habitual: <b>preparas</b> conjuros divinos como un clérigo pequeño y, aparte, obtienes un repertorio <b>espontáneo</b> procedente de las apariciones con las que estés sintonizado hoy.","Tu aparición principal te concede un <b>conjuro de vasija</b> de enfoque único, y con el tiempo la capacidad de transformarte en el <b>avatar</b> de ese espíritu.","Como la sintonización se reinicia cada mañana, tu caja de herramientas cambia de verdad día a día: un espíritu guerrero no se parece en nada a un espíritu de conocimiento.","Recompensa a quien disfrute leyendo un menú de opciones en el desayuno y montando la jornada alrededor de lo que parece que va a pedir la aventura."],"rp":["Eres un puente entre el mundo mortal y el espiritual: en parte consejero, en parte médium, en parte diplomático de aquello que nadie más percibe.","Hablas con —y a veces <i>por</i>— entidades que los demás no ven. Interpretarlo bien pasa por dejar que la aparición tiña tu voz y aquello en lo que te fijas.","Pensar en historias y en escalas de tiempo largas puede parecer distancia o frialdad, aunque estés profundamente atento a quienes te rodean."],"dt":"Gravitas hacia donde tus espíritus sintonizados están más fuertes o más en paz: cuidando cementerios, recorriendo bosques antiguos o pasando largas temporadas en ríos y mares. Los animistas ligados a espíritus de sabiduría frecuentan en cambio bibliotecas y templos, ahondando en la cara erudita del vínculo.","yes":"Quieres lanzamiento preparado y espontáneo a la vez, y un personaje que va acompañado dentro de su propia cabeza.","no":"Quieres un lanzador sencillo. Dos motores de conjuros más una elección diaria de sintonización es mucha superficie que gestionar."}},{"id":"barbarian","hb":0,"type":"Martial","roles":["Striker","Defender"],"s":{"melee":5,"ranged":2,"defenses":4,"magic":0,"support":1,"healing":0,"skills":1,"questing":1,"popularity":4,"difficulty":1},"en":{"name":"Barbarian","src":"Player Core 2","rarity":"Common","hp":"12","key":"Strength","cast":"None","armor":"Light &amp; medium","sub":"Instinct","tag":"The largest hit point pool in the game, pointed at whatever is in front of it.","mech":["<span class=\"act\">&#9670;</span> <b>Rage</b> grants temporary hit points and +2 damage on melee Strikes, and locks you out of concentrate actions that are not themselves rage actions. <b>Quick-Tempered</b> lets you enter it as a free action as combat begins.","<b>12 hit points per level</b> is the ceiling of the system. Paired with Fortitude mastery and rage resistances, you eventually shrug off damage that would end other characters.","Your <b>Instinct</b> &mdash; Animal, Dragon, Fury, Giant, Spirit, Superstition &mdash; flavours the rage, adds resistances, and opens its own feat chain, with an anathema you break at the cost of your rage.","Defences are lopsided by design: strong Fortitude and Will, weak Reflex, and low AC investment offset by sheer durability.","Feats mostly add rage-triggered abilities and bigger single hits rather than new systems, so the turn stays readable."],"rp":["The barbarian solves problems with directness: smash the door, wade into the flooded tunnel, intimidate the guard rather than negotiate.","Rage is not the same as anger. Many barbarians channel grief or focus rather than fury, and plenty are genuinely shrewd &mdash; the class does not imply unintelligent.","Allies lean on your courage and durability; strangers misjudge you as an uncivilised brute, usually once."],"dt":"Barbarians are not built for sitting still. Downtime is another arena for reputation &mdash; carousing in taverns and growing the legend of your exploits, recruiting followers, and for the ambitious, working toward becoming a warlord in your own right.","yes":"You want big numbers, a big health bar, and a turn you can execute without a flowchart.","no":"You want tactical options mid-fight, or to talk your way through problems while raging &mdash; you cannot."},"es":{"name":"Bárbaro","src":"Player Core 2","rarity":"Común","hp":"12","key":"Fuerza","cast":"Ninguno","armor":"Ligera y media","sub":"Instinto","tag":"La mayor reserva de puntos de golpe del juego, apuntada hacia lo que tenga delante.","mech":["<span class=\"act\">&#9670;</span> <b>Furia</b> te da puntos de golpe temporales y +2 al daño en Ataques cuerpo a cuerpo, y te cierra las acciones de concentración que no sean de furia. <b>Temperamento vivo</b> te permite entrar en ella como acción libre al empezar el combate.","<b>12 puntos de golpe por nivel</b> es el techo del sistema. Sumado a la maestría en Fortaleza y a las resistencias de la furia, acabas encajando daño que acabaría con cualquier otro.","Tu <b>Instinto</b> —Animal, Dragón, Furia, Gigante, Espíritu, Superstición— tiñe la furia, añade resistencias y abre su propia cadena de dotes, con un anatema que romper te cuesta la furia.","Las defensas son desiguales a propósito: Fortaleza y Voluntad fuertes, Reflejos flojos y poca inversión en CA, compensada por pura resistencia.","Las dotes añaden sobre todo capacidades ligadas a la furia y golpes más grandes, no sistemas nuevos, así que el turno se mantiene legible."],"rp":["El bárbaro resuelve por la vía directa: derribar la puerta, meterse en el túnel inundado, intimidar al guardia en vez de negociar.","Furia no es lo mismo que enfado. Muchos bárbaros canalizan duelo o concentración antes que ira, y bastantes son genuinamente astutos: la clase no implica ser corto de luces.","Tus aliados se apoyan en tu valor y tu aguante; los desconocidos te toman por un bruto incivilizado, normalmente una sola vez."],"dt":"Los bárbaros no están hechos para quedarse quietos. El tiempo libre es otra arena para la reputación: correrse juergas en tabernas y agrandar la leyenda de tus hazañas, reclutar seguidores y, para los ambiciosos, ir camino de convertirse en señor de la guerra por derecho propio.","yes":"Quieres números grandes, una barra de vida enorme y un turno que puedas ejecutar sin diagrama de flujo.","no":"Quieres opciones tácticas a mitad de combate, o hablar para salir de los problemas mientras estás en furia: no puedes."}},{"id":"bard","hb":0,"type":"Caster","roles":["Support","Controller"],"s":{"melee":2,"ranged":3,"defenses":2,"magic":4,"support":5,"healing":1,"skills":3,"questing":5,"popularity":5,"difficulty":3},"en":{"name":"Bard","src":"Player Core","rarity":"Common","hp":"8","key":"Charisma","cast":"Occult (spontaneous)","armor":"Light","sub":"Muse","tag":"The best force multiplier in the game: a full occult caster whose songs make everyone else better.","mech":["<b>Compositions</b> are focus spells cast through Performance, layering buffs, debuffs and control on top of a real spell repertoire. <span class=\"act\">&#9670;</span> Courageous Anthem lifts the whole party's attack and damage.","You are a <b>spontaneous occult</b> caster, and <b>Signature Spells</b> let you heighten a few favourites freely &mdash; the most forgiving casting chassis in the game.","The occult list is the list of strange problems: mental control, illusions, fear, curses, and some of the sharpest single-target lockdowns available.","Your <b>Muse</b> &mdash; Enigma, Maestro, Polymath, Warrior &mdash; grants a signature trick and opens a feat chain.","Weapon proficiency is better than most casters', so a bard who wants to be in the fight can be."],"rp":["Bards are storytellers, scholars of hidden lore and social operators as much as musicians &mdash; no lute required.","In social scenes you persuade, bluff or threaten with equal comfort; while exploring you are the party's font of legend and context.","People underestimate you as \"just\" a musician, then get blindsided by how much you actually know and can do."],"dt":"Downtime is where the reputation gets built: performing for coin and prestige, cultivating patrons, turning idle weeks into a career. A bard successful enough may find their techniques studied at a bardic college &mdash; a hobby that outlives them.","yes":"You want to be the reason the party wins without needing the biggest numbers on your own sheet, and you enjoy talking.","no":"You want the spotlight in damage terms, or dislike your best contribution being a bonus on someone else's dice."},"es":{"name":"Bardo","src":"Player Core","rarity":"Común","hp":"8","key":"Carisma","cast":"Oculta (espontánea)","armor":"Ligera","sub":"Musa","tag":"El mejor multiplicador de fuerza del juego: un lanzador oculto completo cuyas canciones mejoran a todos los demás.","mech":["Las <b>composiciones</b> son conjuros de enfoque lanzados mediante Interpretar, que superponen mejoras, penalizaciones y control sobre un repertorio real. <span class=\"act\">&#9670;</span> Himno valeroso sube el ataque y el daño de todo el grupo.","Eres un lanzador <b>oculto espontáneo</b>, y los <b>conjuros distintivos</b> te dejan intensificar unos cuantos favoritos con total libertad: el chasis más indulgente del juego.","La lista oculta es la lista de los problemas raros: control mental, ilusiones, miedo, maldiciones y algunos de los bloqueos a un solo objetivo más afilados que existen.","Tu <b>Musa</b> —Enigma, Maestro, Polímata, Guerrero— te concede un truco distintivo y abre una cadena de dotes.","Tu competencia con armas es mejor que la de casi cualquier lanzador, así que un bardo que quiera estar en la refriega puede estarlo."],"rp":["Los bardos son narradores, eruditos de saberes ocultos y operadores sociales tanto como músicos: el laúd es opcional.","En escenas sociales persuades, engañas o amenazas con la misma soltura; explorando, eres la fuente de leyendas y contexto del grupo.","La gente te subestima como «solo un músico» y luego se queda de piedra con lo que realmente sabes y puedes hacer."],"dt":"El tiempo libre es donde se construye la reputación: actuar por dinero y prestigio, cultivar mecenas, convertir las semanas muertas en una carrera. Un bardo con suficiente éxito puede ver sus técnicas estudiadas en un colegio bárdico: una afición que le sobrevive.","yes":"Quieres ser la razón por la que el grupo gana sin necesitar los números más altos en tu propia hoja, y disfrutas hablando.","no":"Quieres el protagonismo en daño, o te incomoda que tu mejor aportación sea un bonificador en los dados de otro."}},{"id":"champion","hb":0,"type":"Martial","roles":["Defender","Support"],"s":{"melee":3,"ranged":2,"defenses":5,"magic":2,"support":3,"healing":2,"skills":1,"questing":2,"popularity":5,"difficulty":2},"en":{"name":"Champion","src":"Player Core 2","rarity":"Common","hp":"10","key":"Strength or Dexterity","cast":"Divine focus spells","armor":"All, incl. heavy","sub":"Deity &amp; Cause","tag":"Heavy armour, a binding oath, and a reaction that punishes anyone who hurts your friends.","mech":["Your <b>champion's reaction</b>, granted by your cause, is the class. The paladin's Retributive Strike hits back at anyone who harms an ally beside you; other causes rescue, blunt the blow, or demand submission instead.","<b>Shield Block</b> is yours from 1st level, and you have full armour proficiency with the best armour and save progression of any class by the endgame.","<b>Devotion</b> focus spells &mdash; <i>lay on hands</i> chief among them &mdash; make you a competent emergency healer on top of being the hardest character to drop.","Your <b>deity</b>, <b>cause</b> and sanctification come with edicts and anathema that genuinely constrain play: break them and you lose your divine abilities until you atone.","The trade is offence. You are built to guard other people, and your damage reflects that."],"rp":["A champion visibly represents their deity, for better or worse. Strangers project their opinion of that god onto you before you have said anything.","The Remaster freed the class from strict alignment, so conviction matters more than paperwork &mdash; but the oath still has teeth.","Play it well by letting the code cost you something. A champion who never faces a choice between winning and keeping their word is not being played."],"dt":"Much of a champion's downtime goes to solemn prayer, contemplation and hard training, plus whatever obligations their cause's edicts impose. Most still carve out real time for an ordinary craft or hobby, if only to feel like a person rather than a symbol.","yes":"You want to be the wall, you like reactive play, and you want a character whose morality is load-bearing.","no":"You want maximum damage, or you find hard-coded behavioural restrictions constraining rather than interesting."},"es":{"name":"Campeón","src":"Player Core 2","rarity":"Común","hp":"10","key":"Fuerza o Destreza","cast":"Conjuros de enfoque divinos","armor":"Todas, incl. pesada","sub":"Deidad y causa","tag":"Armadura pesada, un juramento vinculante y una reacción que castiga a quien haga daño a los tuyos.","mech":["Tu <b>reacción de campeón</b>, que te da tu causa, es la clase. El Golpe retributivo del paladín devuelve el golpe a quien hiera a un aliado a tu lado; otras causas rescatan, amortiguan el daño o exigen sumisión.","Tienes <b>Bloquear con escudo</b> desde nivel 1, competencia con toda la armadura y, al final del recorrido, la mejor progresión de armadura y salvaciones de cualquier clase.","Los conjuros de enfoque de <b>devoción</b> —<i>imposición de manos</i> el primero— te convierten en un sanador de emergencia competente además del personaje más difícil de tumbar.","Tu <b>deidad</b>, tu <b>causa</b> y tu santificación traen edictos y anatemas que condicionan el juego de verdad: romperlos te deja sin capacidades divinas hasta que expíes.","El precio es la ofensiva. Estás construido para proteger a otros, y tu daño lo refleja."],"rp":["Un campeón representa visiblemente a su deidad, para bien o para mal. Los desconocidos proyectan sobre ti su opinión de ese dios antes de que abras la boca.","El Remaster liberó a la clase del alineamiento estricto, así que importa más la convicción que el papeleo, pero el juramento sigue teniendo dientes.","Se juega bien dejando que el código te cueste algo. Un campeón que nunca se enfrenta a elegir entre ganar y mantener su palabra no se está interpretando."],"dt":"Buena parte del tiempo libre se va en oración solemne, contemplación y entrenamiento duro, más las obligaciones que impongan los edictos de la causa. Aun así, casi todos reservan tiempo real para un oficio o afición corriente, aunque solo sea para sentirse personas y no símbolos.","yes":"Quieres ser el muro, te gusta el juego reactivo y quieres un personaje cuya moral sea estructural.","no":"Quieres daño máximo, o las restricciones de conducta escritas en las reglas te parecen una atadura más que un aliciente."}},{"id":"cleric","hb":0,"type":"Caster","roles":["Support","Controller"],"s":{"melee":2,"ranged":2,"defenses":2,"magic":4,"support":3,"healing":5,"skills":2,"questing":2,"popularity":5,"difficulty":3},"en":{"name":"Cleric","src":"Player Core","rarity":"Common","hp":"8","key":"Wisdom","cast":"Divine (prepared)","armor":"Varies by doctrine","sub":"Doctrine","tag":"The definitive divine caster, and still the most efficient healer in Pathfinder.","mech":["Your <b>Divine Font</b> hands you a stack of bonus <i>heal</i> (or <i>harm</i>) spells daily on top of your normal slots. Free healing atop a full list is why clerics are never short of things to do.","<b>Doctrine</b> splits the class: the cloistered cleric is a stronger caster with weaker martial ability; the warpriest takes armour and weapon training and can genuinely fight in melee while casting.","You are a <b>prepared</b> caster, so the morning is a real decision &mdash; a well-read cleric arrives with exactly the right spell, and a careless one does not.","Your <b>deity</b> is mechanical, not decorative: favoured weapon, added spells, and domain focus spells all follow from it.","<span class=\"act\">&#9670;&#9670;&#9670;</span> Heal at three actions is a party-wide burst that has salvaged more fights than any other spell in the game."],"rp":["Clerics live their faith day to day &mdash; visiting temples, quoting scripture, reading religious symbols for the party.","Socially you are the diplomat and the detector of lies, and the person other religious authorities will actually talk to.","Anathema is real and GM-adjudicated. The god who gave you power has opinions, and your party will eventually propose something those opinions forbid."],"dt":"Clerics spend downtime in service: performing rites at a temple, travelling to spread the word, researching scripture, observing holy days. Some go further and found a temple of their own rather than simply attending someone else's.","yes":"You want to be indispensable, you like prepared casting as a planning exercise, and you want faith to be part of the character.","no":"You resent being the designated healer, or would rather not have a deity looking over your shoulder."},"es":{"name":"Clérigo","src":"Player Core","rarity":"Común","hp":"8","key":"Sabiduría","cast":"Divina (preparada)","armor":"Según la doctrina","sub":"Doctrina","tag":"El lanzador divino por definición, y todavía el sanador más eficiente de Pathfinder.","mech":["Tu <b>fuente divina</b> te entrega cada día un montón de conjuros de <i>curar</i> (o <i>dañar</i>) extra, por encima de tus espacios normales. Curación gratis sobre una lista completa: por eso a un clérigo nunca le faltan cosas que hacer.","La <b>doctrina</b> parte la clase en dos: el clérigo enclaustrado es mejor lanzador y peor combatiente; el sacerdote guerrero suma armadura y armas y puede pelear de verdad mientras lanza.","Eres un lanzador <b>preparado</b>, así que la mañana es una decisión real: un clérigo bien informado llega con el conjuro exacto y uno descuidado no.","Tu <b>deidad</b> es mecánica, no decorativa: arma favorecida, conjuros añadidos y conjuros de enfoque de dominio salen todos de ahí.","<span class=\"act\">&#9670;&#9670;&#9670;</span> Curar a tres acciones es una explosión que alcanza a todo el grupo y ha salvado más combates que ningún otro conjuro del juego."],"rp":["Los clérigos viven su fe a diario: visitan templos, citan escrituras, leen los símbolos religiosos para el grupo.","En lo social eres el diplomático y el detector de mentiras, y la persona con la que otras autoridades religiosas aceptan hablar.","El anatema es real y lo arbitra el DJ. El dios que te dio poder tiene opiniones, y tarde o temprano tu grupo propondrá algo que esas opiniones prohíben."],"dt":"Los clérigos dedican el tiempo libre al servicio: oficiar ritos en un templo, viajar para difundir la palabra, investigar las escrituras, celebrar días sagrados. Algunos van más lejos y fundan un templo propio en vez de limitarse a asistir al de otro.","yes":"Quieres ser imprescindible, te gusta el lanzamiento preparado como ejercicio de planificación y quieres que la fe forme parte del personaje.","no":"Te molesta ser el sanador designado, o prefieres no tener una deidad mirándote por encima del hombro."}},{"id":"commander","hb":0,"type":"Martial","roles":["Support","Controller"],"s":{"melee":3,"ranged":3,"defenses":3,"magic":0,"support":5,"healing":1,"skills":4,"questing":3,"popularity":3,"difficulty":4},"en":{"name":"Commander","src":"Battlecry!","rarity":"Common","hp":"8","key":"Intelligence","cast":"None","armor":"All, incl. heavy","sub":"Tactics &amp; Banner","tag":"A battlefield general who spends their turns giving other people extra actions.","mech":["You train <b>squadmates</b> during daily preparations, then issue <b>tactics</b> in combat &mdash; signalled through your personal <b>banner</b> &mdash; that let those allies respond with extra manoeuvres.","It is a genuine action-economy multiplier: your real damage often appears on somebody else's sheet, produced by a reaction that cost the party almost nothing.","You are personally competent too &mdash; full armour, martial weapons and <b>Shield Block</b> &mdash; but the class's power is in setting allies up and then calling the right tactic at the right moment.","Intelligence drives the planning, and a broad tactical skill set makes you the party's organiser out of combat as well.","It plays almost like a real-time-strategy general grafted onto Pathfinder's three-action economy."],"rp":["Commanders think several moves ahead and take charge of conversations and negotiations by instinct.","You hold yourself to brutal personal standards, including for mistakes nobody else noticed.","Others respect the tactical mind but sometimes find you bossy, and academics underestimate how much real study sits behind the barked orders."],"dt":"Commanders network rather than rest &mdash; cultivating contacts among soldiers and aristocrats alike to line up promising work for the party. Many keep the tactical mind sharp with chess, draj, go or imperial conquest, treating strategy games as off-season training.","yes":"You are the person at the table who already tells everyone what to do, and you would like the rules to reward it.","no":"You want personal glory, or your group finds being directed in combat unwelcome. This class needs willing allies."},"es":{"name":"Comandante","src":"Battlecry!","rarity":"Común","hp":"8","key":"Inteligencia","cast":"Ninguno","armor":"Todas, incl. pesada","sub":"Tácticas y estandarte","tag":"Un general de campo que gasta sus turnos en dar acciones extra a los demás.","mech":["Durante las preparaciones diarias entrenas a tus <b>compañeros de escuadra</b>, y en combate emites <b>tácticas</b> —señalizadas con tu <b>estandarte</b> personal— que permiten a esos aliados responder con maniobras adicionales.","Es un multiplicador real de economía de acciones: tu daño verdadero suele aparecer en la hoja de otra persona, mediante una reacción que casi no le cuesta nada al grupo.","También eres competente por tu cuenta —armadura completa, armas marciales y <b>Bloquear con escudo</b>—, pero la fuerza de la clase está en preparar a los aliados y luego cantar la táctica correcta en el momento correcto.","La Inteligencia guía la planificación, y un abanico amplio de habilidades tácticas te convierte también en el organizador del grupo fuera del combate.","Se juega casi como un general de estrategia en tiempo real injertado en la economía de tres acciones de Pathfinder."],"rp":["Los comandantes piensan con varias jugadas de antelación y toman el mando de conversaciones y negociaciones por puro instinto.","Te exiges un nivel brutal, incluso por errores que nadie más ha notado.","Los demás respetan la cabeza táctica pero a veces te encuentran mandón, y los académicos subestiman cuánto estudio real hay detrás de las órdenes."],"dt":"Los comandantes hacen contactos más que descansar: cultivan relaciones entre soldados y aristócratas por igual para conseguirle al grupo trabajos prometedores. Muchos mantienen la mente afilada con ajedrez, draj, go o conquista imperial, tratando los juegos de estrategia como entrenamiento de pretemporada.","yes":"Eres quien ya le dice a todo el mundo lo que tiene que hacer, y te gustaría que las reglas lo recompensaran.","no":"Quieres gloria personal, o tu grupo lleva mal que le dirijan en combate. Esta clase necesita aliados dispuestos."}},{"id":"druid","hb":0,"type":"Caster","roles":["Controller","Support","Utility"],"s":{"melee":2,"ranged":3,"defenses":3,"magic":4,"support":2,"healing":4,"skills":2,"questing":4,"popularity":2,"difficulty":3},"en":{"name":"Druid","src":"Player Core","rarity":"Common","hp":"8","key":"Wisdom","cast":"Primal (prepared)","armor":"Light &amp; medium","sub":"Druidic Order","tag":"Full primal casting, with an order that can make you a healer, a storm, or a bear.","mech":["The <b>primal list</b> is the elemental and natural one: strong area damage, real healing, and a deep bench of terrain-shaping and summoning.","Your <b>Order</b> is the fork in the road. Animal leans on shapeshifting, Leaf on healing and plant magic, Storm on elemental destruction, Wild on a blend of all of it &mdash; each granting an order spell and its own feats.","<b>Shield Block</b> from 1st level gives you more frontline durability than most casters, if you build toward it.","You are a <b>prepared</b> caster with a very wide list, so the druid rewards reading the room the night before more than almost any other class.","Depending on order and feats you can end up a wildshape melee combatant, an elemental blaster, a summoner or a healer &mdash; one of the most build-flexible casters in the game."],"rp":["Druids are nature's advocates, and the interesting version pushes for compromises that let civilisation and the wild coexist rather than picking a side outright.","Anathema is sharp and specific: despoiling nature, over-consuming resources, and teaching the secret <b>Wildsong</b> to outsiders are all off-limits.","Others peg you as a reclusive hermit or a nature-priest who can command the wild at will. Most druids see themselves as stewards and mediators, not masters."],"dt":"Many druids spend downtime crafting magic items and potions, but just as many are out tending a patch of wilderness &mdash; befriending local beasts, healing damage done by encroaching settlement. Some teach sustainable farming or animal husbandry nearby, spreading their values along with the skills.","yes":"You want elemental spectacle, a broad and useful list, and an order that gives you a second identity to grow into.","no":"You want the arcane or occult toolkits, or would rather not deal with prepared-caster planning."},"es":{"name":"Druida","src":"Player Core","rarity":"Común","hp":"8","key":"Sabiduría","cast":"Primigenia (preparada)","armor":"Ligera y media","sub":"Orden druídica","tag":"Lanzamiento primigenio completo, con una orden que puede hacerte sanador, tormenta u oso.","mech":["La <b>lista primigenia</b> es la elemental y natural: buen daño de área, curación real y un banquillo profundo de control del terreno y convocaciones.","Tu <b>orden</b> es la bifurcación. Animal se apoya en el cambio de forma, Hoja en la curación y la magia vegetal, Tormenta en la destrucción elemental, Salvaje en una mezcla de todo, y cada una concede su conjuro de orden y sus dotes.","<b>Bloquear con escudo</b> desde nivel 1 te da más resistencia en primera línea que a la mayoría de lanzadores, si construyes hacia ahí.","Eres un lanzador <b>preparado</b> con una lista muy amplia, así que el druida premia leer la situación la noche anterior más que casi ninguna otra clase.","Según orden y dotes puedes acabar como combatiente cuerpo a cuerpo transformado, artillero elemental, convocador o sanador: uno de los lanzadores más flexibles del juego."],"rp":["Los druidas abogan por la naturaleza, y la versión interesante empuja acuerdos donde civilización y naturaleza convivan, en vez de elegir bando sin más.","El anatema es afilado y concreto: expoliar la naturaleza, consumir recursos en exceso y enseñar el <b>Cantosilvestre</b> secreto a los de fuera están prohibidos.","Los demás te ven como ermitaño huraño o como sacerdote capaz de dominar lo salvaje a voluntad. Casi todos los druidas se ven a sí mismos como custodios y mediadores, no como amos."],"dt":"Muchos druidas fabrican objetos mágicos y pociones, pero otros tantos están fuera cuidando un pedazo de naturaleza: haciéndose amigos de las bestias locales, sanando el daño del asentamiento que avanza. Algunos enseñan agricultura sostenible o ganadería en los alrededores, difundiendo sus valores junto con las técnicas.","yes":"Quieres espectáculo elemental, una lista amplia y útil, y una orden que te dé una segunda identidad en la que crecer.","no":"Quieres las cajas de herramientas arcana u oculta, o prefieres no lidiar con la planificación del lanzador preparado."}},{"id":"exemplar","hb":0,"type":"Martial","roles":["Striker","Support"],"s":{"melee":4,"ranged":3,"defenses":4,"magic":0,"support":2,"healing":1,"skills":2,"questing":2,"popularity":3,"difficulty":3},"en":{"name":"Exemplar","src":"War of Immortals","rarity":"Rare","hp":"10","key":"Strength or Dexterity","cast":"Divine (ikon powers)","armor":"Light &amp; medium","sub":"Ikons &amp; Epithet","tag":"A mortal carrying a spark of unclaimed divinity that belongs to them, not to any god.","mech":["You choose <b>three ikons</b> at 1st level &mdash; a weapon, a worn item, a feature of your own body &mdash; each a genuine mythic object with a name and a history.","Only one ikon holds the spark at a time. That is its <b>immanence</b>, a passive benefit; you can then burn a one-shot <b>transcendence</b> effect through it, which immediately shunts the spark to another ikon.","The loop is a battery moving between three sockets: park the spark where it helps, cash it out at the right moment, shift, repeat. Sequencing it before a big turn is the whole skill.","<b>Epithets</b> &mdash; Root, Dominion, Sovereignty &mdash; build out a personal legend and title with mechanical benefits attached.","<b>Humble Strikes</b> lets simple weapons hit far above their normal weight, so your legendary spear can genuinely be a spear."],"rp":["You are not a god's servant. The power is yours, unclaimed, and the game says so out loud &mdash; a completely different posture from cleric or champion.","Ikons demand backstory as a mechanic. Why is that blade legendary? Whose scar is that? The class does not work until you answer.","People expect you to handle any crisis, which shades into real isolation: allies lean hard on you, strangers read your bearing as arrogance, and the expectations can crush."],"dt":"Exemplars have a hard time sitting still &mdash; inactivity does not suit someone actively building a legend. Left alone they go looking for more deeds: hunting dangerous creatures, entering athletic contests, chasing rumours of lost artifacts.","yes":"You want a mythic-hero fantasy, real in-combat decisions, and almost no daily bookkeeping.","no":"You want a humble character, or one whose interesting choices happen during preparation rather than mid-turn."},"es":{"name":"Ejemplar","src":"War of Immortals","rarity":"Raro","hp":"10","key":"Fuerza o Destreza","cast":"Divina (poderes de icono)","armor":"Ligera y media","sub":"Iconos y epíteto","tag":"Un mortal que porta una chispa de divinidad sin reclamar: suya, no de ningún dios.","mech":["Eliges <b>tres iconos</b> a nivel 1 —un arma, un objeto que llevas puesto, un rasgo de tu propio cuerpo—, cada uno un auténtico objeto mítico con nombre e historia.","Solo un icono contiene la chispa a la vez: esa es su <b>inmanencia</b>, un beneficio pasivo. Después puedes quemar un efecto único de <b>trascendencia</b> a través de él, lo que expulsa la chispa hacia otro icono.","El bucle es una batería que se mueve entre tres zócalos: aparca la chispa donde ayude, cóbrala en el momento justo, desplázala y repite. Secuenciarlo antes de un turno grande es toda la destreza de la clase.","Los <b>epítetos</b> —Raíz, Dominio, Soberanía— construyen una leyenda y un título personales con beneficios mecánicos asociados.","<b>Golpes humildes</b> hace que las armas sencillas golpeen muy por encima de su peso, así que tu lanza legendaria puede ser sinceramente una lanza."],"rp":["No eres el sirviente de un dios. El poder es tuyo, sin reclamar, y el juego lo dice en voz alta: una postura completamente distinta a la del clérigo o el campeón.","Los iconos exigen trasfondo como mecánica. ¿Por qué es legendaria esa hoja? ¿De quién es esa cicatriz? La clase no funciona hasta que respondes.","La gente espera que resuelvas cualquier crisis, y eso deriva en aislamiento real: los aliados se apoyan demasiado, los desconocidos leen tu porte como arrogancia y las expectativas pesan."],"dt":"A los ejemplares les cuesta quedarse quietos: la inactividad no le sienta bien a quien está construyendo una leyenda. Si les dejas a su aire, salen a buscar más hazañas: cazar criaturas peligrosas, competir en pruebas atléticas, perseguir rumores de artefactos perdidos.","yes":"Quieres una fantasía de héroe mítico, decisiones reales en combate y casi nada de contabilidad diaria.","no":"Quieres un personaje humilde, o uno cuyas decisiones interesantes ocurran en la preparación y no a mitad del turno."}},{"id":"fighter","hb":0,"type":"Martial","roles":["Striker","Defender"],"s":{"melee":5,"ranged":4,"defenses":4,"magic":0,"support":2,"healing":0,"skills":2,"questing":1,"popularity":5,"difficulty":1},"en":{"name":"Fighter","src":"Player Core","rarity":"Common","hp":"10","key":"Strength or Dexterity","cast":"None","armor":"All, incl. heavy","sub":"None &mdash; your weapon is the choice","tag":"The most accurate character in the game, and the cleanest turn in Pathfinder.","mech":["You are expert in simple and martial weapons at 1st level and <b>legendary</b> in a favoured group by the endgame. That accuracy compounds into more hits, more critical hits, and everything that follows.","<span class=\"act\">&#8635;</span> <b>Reactive Strike</b> from 1st level makes the space around you dangerous and turns careless enemy movement into free damage.","<b>Combat Flexibility</b> lets you swap in a different feat each day to answer that day's specific problem &mdash; the fighter is far more adaptable between adventuring days than its reputation suggests.","There is no gimmick resource. Instead there is a deep feat list of manoeuvres, stances and combos that chain properly: trip into knockdown into finisher.","No subclass either &mdash; your weapon group is your subclass, and a greatsword, a bow and sword-and-board play like three different classes."],"rp":["Fighters are professionals. They know their gear inside out, respect skill wherever they find it, and have little patience for cerebral solutions when a direct one exists.","There is no supernatural origin story, which makes this the widest character canvas in the game: duellist, mercenary, watch sergeant, retired legend, bodyguard.","Others misjudge you as all brawn until they see the technical depth behind the swordplay."],"dt":"Fighters put idle time toward manual labour or repairing and crafting armaments, and when a technique falls out of favour, downtime is when they retrain into something new. A fighter with a real reputation may go further and found an organisation or stronghold bearing their name.","yes":"You are new to Pathfinder, or experienced and simply want to be extremely good at the thing you do every round.","no":"You want magic or out-of-combat problem-solving tools built into the class rather than bought with skill choices."},"es":{"name":"Guerrero","src":"Player Core","rarity":"Común","hp":"10","key":"Fuerza o Destreza","cast":"Ninguno","armor":"Todas, incl. pesada","sub":"Ninguna — tu arma es la elección","tag":"El personaje más certero del juego, y el turno más limpio de Pathfinder.","mech":["Eres experto en armas sencillas y marciales a nivel 1 y <b>legendario</b> en un grupo favorecido al final. Esa precisión se acumula en más impactos, más críticos y todo lo que se deriva de ellos.","<span class=\"act\">&#8635;</span> <b>Golpe reactivo</b> desde nivel 1 vuelve peligroso el espacio a tu alrededor y convierte el movimiento descuidado del enemigo en daño gratis.","<b>Flexibilidad de combate</b> te permite intercambiar una dote distinta cada día para responder al problema concreto de esa jornada: el guerrero se adapta entre aventuras mucho más de lo que sugiere su fama.","No hay recurso ni truco central. Hay, en cambio, una lista profunda de dotes de maniobras, posturas y combos que encadenan de verdad: derribo, luego aprovechar la caída, luego rematar.","Tampoco hay subclase: tu grupo de armas <i>es</i> la subclase, y espadón, arco y espada y escudo se juegan como tres clases distintas."],"rp":["Los guerreros son profesionales. Conocen su equipo al dedillo, respetan la pericia allá donde la encuentran y tienen poca paciencia para soluciones cerebrales cuando existe una directa.","No hay origen sobrenatural, lo que convierte esto en el lienzo más amplio del juego: duelista, mercenario, sargento de la guardia, leyenda retirada, guardaespaldas.","Los demás te juzgan como puro músculo hasta que ven la profundidad técnica detrás del manejo del arma."],"dt":"Los guerreros dedican el tiempo libre al trabajo manual o a reparar y fabricar armamento, y cuando una técnica cae en desuso, es el momento de reentrenar hacia otra. Uno con reputación de verdad puede ir más lejos y fundar una organización o una fortaleza que lleve su nombre.","yes":"Eres nuevo en Pathfinder, o tienes experiencia y simplemente quieres ser buenísimo en lo que haces cada asalto.","no":"Quieres magia o herramientas para resolver problemas fuera del combate integradas en la clase, en vez de compradas con habilidades."}},{"id":"guardian","hb":0,"type":"Martial","roles":["Defender","Support"],"s":{"melee":3,"ranged":1,"defenses":5,"magic":0,"support":3,"healing":0,"skills":2,"questing":1,"popularity":4,"difficulty":2},"en":{"name":"Guardian","src":"Battlecry!","rarity":"Common","hp":"12","key":"Strength","cast":"None","armor":"All, incl. heavy","sub":"None at 1st","tag":"A dedicated tank whose entire design is that the danger goes through you first.","mech":["Wearing medium or heavy armour gives you passive <b>resistance to physical damage</b> &mdash; you are reduced before anything else happens.","<span class=\"act\">&#9670;</span> <b>Taunt</b> makes you the obviously correct target and punishes enemies who attack anyone else.","<span class=\"act\">&#8635;</span> <b>Intercept Attack</b> lets you physically step in and take a hit meant for a nearby ally. Very few classes get to say no on someone else's behalf.","<b>12 hit points per level</b>, and eventually the ability to swap Dexterity for your armour's item bonus on Reflex saves, make you extremely hard to remove from a fight.","Damage output is deliberately modest. You are denying enemies good targets, not racing anyone for kills."],"rp":["Guardians take visible pride in soaking hits meant for others, and tend to joke about it rather than complain.","You are wary of anyone outside your circle of trust and most at ease on a battlefield where friend and foe are clear-cut.","Allies genuinely feel safer near you, even the ones who cannot understand why taunting a monster on purpose is a plan."],"dt":"Armour and shields take a beating in the field, so downtime starts with repair and maintenance. With time left over, many guardians take manual labour or work as a town guard &mdash; protection is simply the trade they know.","yes":"You genuinely enjoy protecting people and want that to be your contribution rather than a side effect.","no":"You measure a good session in damage dealt. The guardian trades offence away almost entirely."},"es":{"name":"Guardián","src":"Battlecry!","rarity":"Común","hp":"12","key":"Fuerza","cast":"Ninguno","armor":"Todas, incl. pesada","sub":"Ninguna a nivel 1","tag":"Un tanque dedicado cuyo diseño entero consiste en que el peligro pase primero por ti.","mech":["Llevar armadura media o pesada te da <b>resistencia pasiva al daño físico</b>: te reducen el golpe antes de que ocurra nada más.","<span class=\"act\">&#9670;</span> <b>Provocar</b> te convierte en el objetivo obviamente correcto y castiga a los enemigos que ataquen a cualquier otro.","<span class=\"act\">&#8635;</span> <b>Interceptar ataque</b> te deja meterte físicamente y encajar un golpe dirigido a un aliado cercano. Muy pocas clases pueden decir «no» en nombre de otro.","<b>12 puntos de golpe por nivel</b> y, con el tiempo, la posibilidad de cambiar Destreza por el bonificador de objeto de tu armadura en Reflejos, te hacen dificilísimo de sacar de un combate.","El daño es deliberadamente modesto. Estás negándole buenos objetivos al enemigo, no compitiendo por bajas."],"rp":["Los guardianes se enorgullecen visiblemente de encajar golpes ajenos, y suelen bromear con ello en vez de quejarse.","Desconfías de quien esté fuera de tu círculo y estás más cómodo en un campo de batalla donde amigo y enemigo están claros.","Tus aliados se sienten sinceramente más seguros a tu lado, incluso los que no entienden por qué provocar a un monstruo a propósito es un plan."],"dt":"La armadura y los escudos sufren mucho sobre el terreno, así que el tiempo libre empieza por reparar y mantener. Con lo que sobra, muchos guardianes hacen trabajo manual o sirven como guardia del pueblo: proteger es sencillamente el oficio que conocen.","yes":"Disfrutas de verdad protegiendo a los demás y quieres que esa sea tu aportación, no un efecto secundario.","no":"Mides una buena sesión en daño infligido. El guardián renuncia a la ofensiva casi por completo."}},{"id":"gunslinger","hb":0,"type":"Martial","roles":["Striker"],"s":{"melee":2,"ranged":5,"defenses":3,"magic":1,"support":2,"healing":0,"skills":2,"questing":2,"popularity":1,"difficulty":2},"en":{"name":"Gunslinger","src":"Guns &amp; Gears","rarity":"Uncommon","hp":"8","key":"Dexterity","cast":"None","armor":"Light &amp; medium","sub":"Gunslinger's Way","tag":"Precision ranged mastery, a weapon that can jam, and more style than is strictly necessary.","mech":["You are the ranged analog of the fighter: best-in-class proficiency with firearms and crossbows, and <b>Slinger's Precision</b> adding solid damage to non-repeating guns and crossbows.","Your <b>way</b> &mdash; Drifter, Pistolero, Sniper, Vanguard and others &mdash; sets your signature <b>deeds</b> and a unique reload action that folds reloading into something useful.","<b>Misfires</b> are real: an uncleaned firearm can jam on a bad flat check, which puts genuine tension into a long fight and makes maintenance part of the character.","Firearms hit disproportionately hard on a critical hit, so the class is built around landing fewer, larger shots rather than a steady stream.","Beyond misfire management there is no single unifying gimmick &mdash; the way you chose supplies called shots, mobile gunplay or ambush setups instead."],"rp":["Gunslingers are gear-heads who take real pride in their weapon's mechanics, and gravitate toward places where conflict and reputation are found.","Guns in Golarion are rare, loud and slightly disreputable. Carrying one marks you, and there is always a story about where it came from.","Others assume you are a one-trick shooter, which undersells both your vigilance and your grit."],"dt":"Keeping a firearm from misfiring takes real work, so downtime means crafting ammunition and cleaning weapons as a matter of course. Beyond that, many look for work that suits the skill set &mdash; blacksmithing, engineering, joining the watch &mdash; and are as likely to drift between towns as settle in one.","yes":"You want big, dramatic single hits and a character with genuine swagger.","no":"Your table does not use firearms, or you find per-round reload and misfire management tedious rather than tactical."},"es":{"name":"Pistolero","src":"Guns &amp; Gears","rarity":"Infrecuente","hp":"8","key":"Destreza","cast":"Ninguno","armor":"Ligera y media","sub":"Senda del pistolero","tag":"Maestría a distancia de precisión, un arma que se puede encasquillar y más estilo del estrictamente necesario.","mech":["Eres el equivalente a distancia del guerrero: la mejor competencia con armas de fuego y ballestas, y <b>Precisión del pistolero</b> añade buen daño con las que no son de repetición.","Tu <b>senda</b> —Errante, Pistolero de duelo, Tirador, Vanguardia y otras— fija tus <b>gestas</b> distintivas y una acción de recarga propia que integra el recargar en algo útil.","Los <b>encasquillamientos</b> son reales: un arma de fuego sucia puede atascarse con una mala tirada plana, lo que mete tensión de verdad en un combate largo y convierte el mantenimiento en parte del personaje.","Las armas de fuego golpean desproporcionadamente fuerte en crítico, así que la clase se construye alrededor de acertar menos disparos pero más grandes.","Más allá de gestionar el encasquillamiento no hay un truco unificador: es la senda elegida la que aporta disparos calculados, tiroteo en movimiento o emboscadas."],"rp":["Los pistoleros son fanáticos del equipo, orgullosos de la mecánica de su arma, y gravitan hacia donde hay conflicto y reputación.","Las armas de fuego en Golarion son raras, ruidosas y algo desprestigiadas. Llevar una te marca, y siempre hay una historia sobre de dónde salió.","Los demás dan por hecho que eres un tirador de un solo truco, lo que infravalora tanto tu vigilancia como tu aguante."],"dt":"Evitar que un arma se encasquille cuesta trabajo real, así que el tiempo libre es fabricar munición y limpiar armas como rutina. Aparte, muchos buscan un oficio que encaje —herrería, ingeniería, entrar en la guardia— y son tan propensos a ir de pueblo en pueblo como a asentarse en uno.","yes":"Quieres impactos únicos, grandes y dramáticos, y un personaje con auténtica chulería.","no":"En tu mesa no se usan armas de fuego, o la gestión de recarga y encasquillamiento te resulta tediosa más que táctica."}},{"id":"inventor","hb":0,"type":"Martial","roles":["Striker","Utility","Support"],"s":{"melee":3,"ranged":3,"defenses":3,"magic":0,"support":2,"healing":1,"skills":4,"questing":2,"popularity":1,"difficulty":3},"en":{"name":"Inventor","src":"Guns &amp; Gears","rarity":"Uncommon","hp":"8","key":"Intelligence","cast":"None","armor":"Light &amp; medium","sub":"Innovation","tag":"One brilliant prototype that grows with you, and that keeps nearly exploding.","mech":["You build a single <b>innovation</b> &mdash; armour, a weapon, or a construct companion &mdash; that levels alongside you and takes modifications you can <b>Reconfigure</b> between adventures.","<span class=\"act\">&#9670;</span> <b>Overdrive</b> is a Crafting check that adds damage on a success and can literally blow up in your face on a critical failure. Crafting is a combat stat here, not a background skill.","<b>Unstable</b> actions such as Explode deliberately push the innovation past safe limits for a bigger payoff at real risk of breaking it.","That gives you area damage on a martial chassis, which is unusual and very useful.","The class is the clearest expression in Pathfinder of high risk and high reward routed through a skill check."],"rp":["Inventors treat combat as a testing ground. Winning matters less than the data collected, which is a genuinely odd and fun priority to play.","You ramble enthusiastically about technical minutiae, wear the grime of the workshop, and chase patronage to fund increasingly unorthodox experiments.","Onlookers alternate between marvelling at the results and quietly worrying the next device is going to go off."],"dt":"Inventors spend downtime brainstorming designs and painstakingly building them, revising past inventions against data gathered in the field. Many take work as a local smith or tinkerer; others keep a workshop on the edge of town, where the clanks, sparks and occasional small explosion draw less attention.","yes":"You love a signature invention you tune across the campaign, and you enjoy a calculated gamble.","no":"You want reliability. Overdrive can fail and unstable actions can break your central item mid-fight."},"es":{"name":"Inventor","src":"Guns &amp; Gears","rarity":"Infrecuente","hp":"8","key":"Inteligencia","cast":"Ninguno","armor":"Ligera y media","sub":"Innovación","tag":"Un prototipo brillante que crece contigo y que está siempre a punto de estallar.","mech":["Construyes una única <b>innovación</b> —armadura, arma o compañero constructo— que sube de nivel contigo y admite modificaciones que puedes <b>Reconfigurar</b> entre aventuras.","<span class=\"act\">&#9670;</span> <b>Sobremarcha</b> es una prueba de Fabricar que añade daño si tiene éxito y que puede estallarte literalmente en la cara con un fallo crítico. Aquí Fabricar es una estadística de combate, no de trasfondo.","Las acciones <b>inestables</b>, como Explotar, fuerzan deliberadamente la innovación más allá de lo seguro a cambio de un premio mayor y del riesgo real de romperla.","Eso te da daño de área sobre un chasis marcial, lo cual es infrecuente y muy útil.","Es la expresión más clara en Pathfinder de riesgo alto y recompensa alta canalizados a través de una prueba de habilidad."],"rp":["Los inventores tratan el combate como banco de pruebas. Ganar importa menos que los datos recogidos, que es una prioridad genuinamente rara y divertida de interpretar.","Divagas con entusiasmo sobre minucias técnicas, llevas encima la mugre del taller y persigues mecenazgos para financiar experimentos cada vez más heterodoxos.","Quien te mira alterna entre maravillarse con los resultados y preocuparse en voz baja por que el próximo cacharro salte por los aires."],"dt":"Los inventores dedican el tiempo libre a idear diseños y construirlos con esfuerzo, revisando invenciones pasadas con los datos recogidos sobre el terreno. Muchos trabajan como herrero o manitas local; otros mantienen un taller a las afueras, donde los golpes, las chispas y alguna pequeña explosión llaman menos la atención.","yes":"Te encanta la idea de una invención distintiva que afinas durante toda la campaña, y disfrutas de una apuesta calculada.","no":"Quieres fiabilidad. Sobremarcha puede fallar y las acciones inestables pueden romperte el objeto central a mitad de combate."}},{"id":"investigator","hb":0,"type":"Martial","roles":["Utility","Striker"],"s":{"melee":2,"ranged":3,"defenses":2,"magic":1,"support":3,"healing":3,"skills":5,"questing":5,"popularity":1,"difficulty":4},"en":{"name":"Investigator","src":"Player Core 2","rarity":"Common","hp":"8","key":"Intelligence","cast":"None","armor":"Light","sub":"Methodology","tag":"A detective who rolls the die before they swing, and knows more than anyone else at the table.","mech":["<span class=\"act\">&#9670;</span> <b>Devise a Stratagem</b> pre-rolls a d20 that you may substitute for your Strike this turn, and lets you use Intelligence in place of Strength or Dexterity on that attack. You know whether it lands before committing.","<b>Pursue a Lead</b> opens a formal investigation into a specific question and grants a circumstance bonus on checks to answer it &mdash; a real out-of-combat subsystem, not a flavour button.","Your <b>Methodology</b> &mdash; Empiricism, Forensic Medicine, Interrogation, Alchemical Sciences &mdash; sets your investigative specialty and your tools.","You have a deep skill list, and by late levels you can attempt almost any skill check untrained.","Combat damage is modest by design. You win fights by pre-planning a hit rather than out-damaging anyone."],"rp":["Investigators cannot leave a puzzle alone. Every conversation becomes an interrogation and every scene yields a thread worth pulling, relevant or not.","Devise a Stratagem is roleplay disguised as a rule &mdash; mechanically you are predicting the outcome, and saying that out loud is the pleasure of the class.","Allies rely on you to crack cases; some find the constant deductions exhausting even while leaning on them completely."],"dt":"Downtime looks like continuing education &mdash; studying new and old subjects, cultivating contacts who trade in information, keeping an active mind occupied. Quite a few earn on the side as a private detective or a consultant to the local constabulary, since it is the same skill set either way.","yes":"You want to be the smartest person in the room, your GM runs mysteries, and you like knowing the outcome before you commit.","no":"Your campaign is a straight dungeon crawl. Much of this class aims at problems a pure combat game will not present."},"es":{"name":"Investigador","src":"Player Core 2","rarity":"Común","hp":"8","key":"Inteligencia","cast":"Ninguno","armor":"Ligera","sub":"Metodología","tag":"Un detective que tira el dado antes de golpear, y que sabe más que nadie en la mesa.","mech":["<span class=\"act\">&#9670;</span> <b>Idear una estratagema</b> tira por adelantado un d20 que puedes sustituir por tu Ataque en ese turno, y te permite usar Inteligencia en vez de Fuerza o Destreza en esa tirada. Sabes si acierta antes de comprometerte.","<b>Seguir una pista</b> abre una investigación formal sobre una pregunta concreta y te da un bonificador de circunstancia para responderla: un subsistema real fuera del combate, no un botón de ambientación.","Tu <b>metodología</b> —Empirismo, Medicina forense, Interrogatorio, Ciencias alquímicas— fija tu especialidad y tus herramientas.","Tienes una lista de habilidades muy profunda y, a niveles altos, puedes intentar casi cualquier prueba sin estar entrenado.","El daño en combate es modesto a propósito. Ganas los combates planificando el golpe, no superando a nadie
