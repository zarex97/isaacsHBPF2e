n ejército entero cayendo ante una sola ilusión—, así que cuenta con ser el personaje en cuya cabeza se mete el villano."],"dt":"Entrenar con el espíritu de tu arma, y discutir con él —las mesas que usan la Liberación Total como desbloqueo narrativo condicionan el Bankai justo a esa relación— y atender las apariciones, posesiones y almas perdidas que sólo un Konsō puede resolver.","yes":"Quieres una escalada con forma de anime —normal en el primer asalto, decisivo en el cuarto— y una subclase con un poder con nombre, fiel al canon y con una personalidad dentro.","no":"Quieres tu mejor turno al principio del combate, o no te apetece leer una subclase de dos ejes con quince opciones para crear tu personaje.","est":"No es una valoración de Classfinder. Barras estimadas para este códice a partir de la guía, ancladas en el <b>Magus</b> (arma más un arsenal mágico, centrado en turnos de golpe fuerte) y el <b>Bárbaro</b> (un estado liberado que dura todo el encuentro), con el perfil de salvaciones del Monje. La popularidad no se valora en el homebrew."}},{"id":"assimilator","hb":1,"type":"Martial","roles":["Striker","Defender"],"s":{"melee":4,"ranged":1,"defenses":4,"magic":1,"support":1,"healing":1,"skills":1,"questing":2,"popularity":null,"difficulty":5},"en":{"name":"Assimilator","src":"Isaac's Homebrew &middot; guide v1.3","rarity":"Homebrew","hp":"10","key":"Strength or Dexterity","cast":"None &mdash; Substrate Mutations","armor":"None &mdash; the living Carapace (unarmoured)","sub":"Instinct (9, set by what you eat)","tag":"Something alive is wearing you, and it grows by eating gems and metals. Your build is a stomach, and its contents are visible on you.","mech":["No weapons and no armour, ever. You fight with one <b>Carapace Strike</b> (1d8 bludgeoning, brawling) and wear <b>Living Plate</b>, a symbiont that takes armour runes like explorer's clothing. Handwraps work normally, and you buy them.","<b>Assimilation</b>: you <b>Feed</b> for 10 minutes on <b>Substrates</b> &mdash; thirty-six gems and metals across two Mass pools &mdash; and each becomes a <b>Mutation</b> whose <b>Depth</b> (1&ndash;4) rises as you feed it more. The Depth cap rises at 5th, 11th and 17th, and that is the whole level-up.","Your <b>Instinct</b> is the subclass, and you don't pick it: it is whichever of nine colours you have fed the most Mass, and its clause applies to every Mutation you carry. The same ruby burns hotter under Red, feeds you under Green and steals under Black.","Your plate has Hardness and Hit Points, and <span class=\"act\">&#8635;</span> <b>Carapace Block</b> soaks physical damage into it. Break it and every Mutation at Depth 3 or higher switches off until it is repaired &mdash; the only true failure state among these classes.","<b>Bonds</b> (five slots, 4th to 20th) are a third thing that happens when two Substrates sit at Depth 2 together. Becoming something else costs material: what you <b>Shed</b> is destroyed."],"rp":["You are two organisms sharing a body, and the other one has opinions about being hit. Describe the plate every time you feed it &mdash; the class's whole premise is that the build is visible.","A Red Assimilator lights the room; a Green one drips; a Black one is hard to look at directly. Nobody mistakes you for anything else.","Every strange gem the party finds is a temptation and a negotiation: it may be worth more to the thing inside you than to the treasury."],"dt":"Prospecting, and eating. Ordinary specimens are bought, looted or prised out of statues; the Depth 3&ndash;4 &lsquo;quickened&rsquo; ones grow somewhere impossible and are adventures in their own right. Downtime is shopping, chasing rumours of a leyline-grown sapphire, and reshaping yourself between jobs.","yes":"You love theory-crafting a build across a whole campaign, want your growth tied to loot and story, and enjoy a body-horror bruiser.","no":"You want a finished character at 1st level, dislike tracking two Mass pools across thirty-six materials, or your GM doesn't want to hand out your power curve as treasure.","est":"Not a Classfinder rating. Bars estimated for this codex from the guide, anchored on the <b>Monk</b> (the chassis it copies: unarmoured, unarmed, 10 HP) and the <b>Alchemist</b> (a material economy and the highest bookkeeping load in the game). Popularity is not rated for homebrew."},"es":{"name":"Asimilador","src":"Homebrew de Isaac &middot; guía v1.3","rarity":"Homebrew","hp":"10","key":"Fuerza o Destreza","cast":"Ninguno — Mutaciones de Sustrato","armor":"Ninguna — el Caparazón vivo (sin armadura)","sub":"Instinto (9, según lo que comes)","tag":"Algo vivo te lleva puesto, y crece comiendo gemas y metales. Tu construcción es un estómago, y su contenido se te ve encima.","mech":["Sin armas y sin armadura, nunca. Peleas con un único <b>Golpe de Caparazón</b> (1d8 contundente, grupo pelea) y llevas la <b>Placa Viva</b>, un simbionte que acepta runas de armadura como si fuera ropa de explorador. Las vendas de golpes poderosos funcionan con normalidad, y te las compras.","<b>Asimilación</b>: te <b>Alimentas</b> durante 10 minutos de <b>Sustratos</b> —treinta y seis gemas y metales repartidos en dos reservas de Masa— y cada uno se convierte en una <b>Mutación</b> cuya <b>Profundidad</b> (1–4) sube cuanto más lo comes. El límite de Profundidad sube a 5.º, 11.º y 17.º, y esa es toda la subida de nivel.","Tu <b>Instinto</b> es la subclase, y no lo eliges: es el color, de nueve, en el que más Masa has invertido, y su cláusula se aplica a todas tus Mutaciones. El mismo rubí quema más bajo el Rojo, te alimenta bajo el Verde y roba bajo el Negro.","Tu placa tiene Dureza y Puntos de Golpe, y <span class=\"act\">&#8635;</span> el <b>Bloqueo de Caparazón</b> absorbe en ella el daño físico. Si se rompe, toda Mutación de Profundidad 3 o más se apaga hasta repararla: el único estado de fallo real entre estas clases.","Los <b>Vínculos</b> (cinco huecos, de 4.º a 20.º) son una tercera cosa que surge cuando dos Sustratos conviven a Profundidad 2. Convertirte en otra cosa cuesta material: lo que <b>Mudas</b> se destruye."],"rp":["Sois dos organismos compartiendo un cuerpo, y el otro tiene opiniones sobre recibir golpes. Describe la placa cada vez que la alimentas: toda la premisa de la clase es que la construcción se ve.","Un Asimilador Rojo ilumina la sala; uno Verde gotea; uno Negro cuesta mirarlo de frente. Nadie te confunde con otra cosa.","Cada gema extraña que encuentra el grupo es una tentación y una negociación: puede valer más para lo que llevas dentro que para el tesoro común."],"dt":"Buscar material, y comérselo. Los ejemplares corrientes se compran, se saquean o se arrancan de las estatuas; los «avivados» de Profundidad 3–4 crecen en sitios imposibles y son aventuras por sí mismos. El tiempo libre es ir de compras, perseguir rumores de un zafiro crecido sobre una línea ley y rehacerte entre encargo y encargo.","yes":"Te encanta pulir una construcción a lo largo de toda una campaña, quieres que tu crecimiento esté ligado al botín y a la historia, y disfrutas de un pegador de horror corporal.","no":"Quieres un personaje terminado a 1.er nivel, no te apetece llevar dos reservas de Masa entre treinta y seis materiales, o tu DJ no quiere repartir tu curva de poder como tesoro.","est":"No es una valoración de Classfinder. Barras estimadas para este códice a partir de la guía, ancladas en el <b>Monje</b> (el chasis que copia: sin armadura, sin armas, 10 PG) y el <b>Alquimista</b> (una economía de materiales y la mayor carga de contabilidad del juego). La popularidad no se valora en el homebrew."}},{"id":"stargazer","hb":1,"type":"Caster","roles":["Support","Utility","Controller"],"s":{"melee":1,"ranged":2,"defenses":2,"magic":3,"support":5,"healing":2,"skills":3,"questing":5,"popularity":null,"difficulty":4},"en":{"name":"Stargazer","src":"Isaac's Homebrew &middot; guide v3.1","rarity":"Homebrew","hp":"8","key":"Wisdom","cast":"Occult cantrips + Auguries (focus), no slots","armor":"Light","sub":"Stargazer's Path (4)","tag":"An occult diviner who reads the sky every dawn, bends other people's dice with a reaction, and can rewind a round that went wrong.","mech":["<span class=\"act\">&#8635;</span> <b>Fortune's Thread</b> is the class: when a creature within 30 feet is about to roll, <b>Guide</b> it (+1 circumstance) or <b>Snarl</b> it (&minus;1, never on a saving throw). It becomes &plusmn;2 at 9th, reaches two creatures at 5th and three at 17th, and <span class=\"act\">&#9670;</span> <b>Chart the Course</b> spends an action to buy extra Threads.","<b>Night Vigil</b>: each dawn you learn the day's sign and aspect exactly, plus the next three days; you gain that sign's <b>Augury of the Day</b>; and you can brief allies so a bad sky hurts them one step less.","<b>Portent</b>: roll a d20 at dawn and keep it. Once a day, any creature's attack, save or skill die simply <i>is</i> your Portent &mdash; a natural 20 if you rolled one.","No spell slots: five occult cantrips and nine known <b>Auguries</b> &mdash; focus spells such as fear on five creatures at 1st level, a reaction that refuses a death, and buffs that rival Courageous Anthem &mdash; on a pool of 1 to 3 points.","Rewinds at three scales: a GM-run prophetic dream, <b>Unmake the Moment</b> at 11th (rewind the last round, once a day) and <b>Rewrite the Ending</b> at 19th (rewind a whole encounter, once a week)."],"rp":["You know things nobody else does &mdash; today's sky, tomorrow's, the hour of a stranger's death &mdash; and you have to decide how much to say.","In a frontier town you walk in with something to sell; in a city with an observatory you walk into rivals. Almanac-sellers and hedge-astrologers are your peers.","Your contribution is usually a number on somebody else's sheet. Play it well by narrating the luck you move."],"dt":"Watching the sky is literally your daily preparation. Between adventures you keep almanacs, sell forecasts, advise anyone planning a voyage or a war, and argue with other astrologers about what last month's Malefic Scorpio meant.","yes":"You want to be the party's luck and information engine, enjoy reactive play, and like knowing what is coming before anyone else does.","no":"You want to fight, or your table rolls fast behind a screen &mdash; this class needs rolls announced before they are made.","est":"Not a Classfinder rating. Bars estimated for this codex from the guide, anchored on the <b>Bard</b> (support) and the <b>Investigator</b> (Perception and foreknowledge). Note that this class is deliberately costed <b>36% above</b> the standard budget (2860 BCS points against 2100), and its own guide calls it the strongest character in a party of on-budget classes. Popularity is not rated for homebrew."},"es":{"name":"Astrólogo","src":"Homebrew de Isaac &middot; guía v3.1","rarity":"Homebrew","hp":"8","key":"Sabiduría","cast":"Trucos ocultistas + Augurios (enfoque), sin espacios","armor":"Ligera","sub":"Senda del Astrólogo (4)","tag":"Un adivino ocultista que lee el cielo cada amanecer, tuerce los dados ajenos con una reacción y puede rebobinar un asalto que salió mal.","mech":["<span class=\"act\">&#8635;</span> El <b>Hilo de la Fortuna</b> es la clase: cuando una criatura a 30 pies va a tirar, la <b>Guías</b> (+1 de circunstancia) o la <b>Enredas</b> (−1, nunca en una salvación). Sube a ±2 a 9.º, alcanza a dos criaturas a 5.º y a tres a 17.º, y <span class=\"act\">&#9670;</span> <b>Trazar el Rumbo</b> gasta una acción para comprar Hilos extra.","<b>Vigilia Nocturna</b>: cada amanecer conoces exactamente el signo y el aspecto del día, más los tres días siguientes; ganas el <b>Augurio del Día</b> de ese signo; y puedes avisar a tus aliados para que un mal cielo les afecte un paso menos.","<b>Presagio</b>: tira un d20 al amanecer y guárdalo. Una vez al día, el dado de ataque, salvación o habilidad de cualquier criatura simplemente <i>es</i> tu Presagio: un 20 natural si lo sacaste.","Sin espacios de conjuro: cinco trucos ocultistas y nueve <b>Augurios</b> conocidos —conjuros de enfoque como miedo sobre cinco criaturas a 1.er nivel, una reacción que niega una muerte y mejoras que rivalizan con el Himno de coraje— sobre una reserva de 1 a 3 puntos.","Rebobinados a tres escalas: un sueño profético que dirige el DJ, <b>Deshacer el Momento</b> a 11.º (rebobina el último asalto, una vez al día) y <b>Reescribir el Final</b> a 19.º (rebobina un encuentro entero, una vez a la semana)."],"rp":["Sabes cosas que nadie más sabe —el cielo de hoy, el de mañana, la hora de la muerte de un desconocido— y tienes que decidir cuánto decir.","En un pueblo fronterizo llegas con algo que vender; en una ciudad con observatorio te encuentras rivales. Los vendedores de almanaques y los astrólogos de feria son tus colegas.","Tu aportación suele ser un número en la hoja de otra persona. Júgalo bien narrando la suerte que mueves."],"dt":"Observar el cielo es, literalmente, tu preparación diaria. Entre aventuras llevas almanaques, vendes pronósticos, asesoras a quien planee un viaje o una guerra y discutes con otros astrólogos sobre qué significó el Escorpio Maléfico del mes pasado.","yes":"Quieres ser el motor de suerte e información del grupo, disfrutas del juego reactivo y te gusta saber lo que viene antes que nadie.","no":"Quieres pelear, o en tu mesa se tira deprisa detrás de la pantalla: esta clase necesita que las tiradas se anuncien antes de hacerse.","est":"No es una valoración de Classfinder. Barras estimadas para este códice a partir de la guía, ancladas en el <b>Bardo</b> (apoyo) y el <b>Investigador</b> (Percepción y presciencia). Ojo: esta clase está costeada a propósito un <b>36 % por encima</b> del presupuesto estándar (2860 puntos BCS frente a 2100), y su propia guía la llama el personaje más fuerte de un grupo de clases dentro de presupuesto. La popularidad no se valora en el homebrew."}},{"id":"breathslayer","hb":2,"type":"Martial","roles":["Striker"],"s":{"melee":null,"ranged":null,"defenses":null,"magic":null,"support":null,"healing":null,"skills":null,"questing":null,"popularity":null,"difficulty":null},"en":{"name":"Breath Slayer","src":"Isaac's Homebrew &middot; guide v5 (unbuilt)","rarity":"Concept","hp":"10","key":"Strength or Dexterity","cast":"None &mdash; Forms are martial actions","armor":"Light &amp; unarmoured","sub":"Breathing Style (12)","tag":"A demon hunter with a nichirin blade whose power lives in the order of its sword Forms: chain them right and the breath builds.","mech":["Each <b>Breathing Style</b> &mdash; Water, Flame, Thunder, Wind and Stone, through Mist, Moon and the progenitor, Sun &mdash; is a wheel of nine <b>Forms</b> plus a Secret Form. Forms are martial actions: no rank, no resource, usable every turn.","Each Form is judged against the one before it. Step the right distance around your wheel and the breath <b>Flows</b> (Breath Count +1 and a rider); step the wrong way and it <b>Breaks</b> (the Count resets to 1).","Once per round the <b>Crest</b> lets one Form carry +1d6 per point of Breath Count. At Count 3 that Form costs one action less; at Count 7 your Secret Form opens &mdash; and drops the Count back to 0.","A floor that never switches off: <b>Concentrated Breathing</b> adds precision damage per weapon die while you hold your Breathing Stance, and the <b>Demon Slayer Mark</b> at 13th makes every step Flow for a minute.","<b>Status:</b> a complete design guide (v5) exists, but the class has not been built or played, so this codex does not rate it yet."],"rp":["You belong to a corps that hunts demons by night with no official sanction, and the colour of your blade is the colour of your style.","A Breathing Style is a lineage: a teacher, a line of students, and rivals in the sister styles that branched from yours.","Moon Breathing is a villain's style; Sun is the one every other style descends from. Which you study says something about your story."],"dt":"Drills, breathing exercises that continue in your sleep, and long visits to the swordsmith who forged your blade &mdash; and who will reforge it, free, when you break it.","yes":"You enjoy sequencing puzzles, want a martial whose turns get better as a combo builds, and like a style with a strong visual identity.","no":"You want a simple turn. Every action asks you where you are on the wheel and what the last Form was.","est":"<b>Not rated.</b> A full guide exists in the repository (Docs/breath-slayer-guide-v5.md), but the class has not been built or playtested, so every bar is shown as unknown."},"es":{"name":"Cazador de la Respiración","src":"Homebrew de Isaac &middot; guía v5 (sin construir)","rarity":"Concepto","hp":"10","key":"Fuerza o Destreza","cast":"Ninguno — las Formas son acciones marciales","armor":"Ligera y sin armadura","sub":"Estilo de Respiración (12)","tag":"Un cazador de demonios con una espada nichirin cuyo poder vive en el orden de sus Formas: encadénalas bien y la respiración crece.","mech":["Cada <b>Estilo de Respiración</b> —Agua, Llama, Trueno, Viento y Piedra, hasta Niebla, Luna y el progenitor, Sol— es una rueda de nueve <b>Formas</b> más una Forma Secreta. Las Formas son acciones marciales: sin rango, sin recurso, utilizables cada turno.","Cada Forma se juzga contra la anterior. Avanza la distancia correcta en tu rueda y la respiración <b>Fluye</b> (Cuenta de Respiración +1 y un efecto extra); avanza mal y se <b>Rompe</b> (la Cuenta vuelve a 1).","Una vez por asalto, la <b>Cresta</b> permite que una Forma lleve +1d6 por punto de Cuenta. Con Cuenta 3 esa Forma cuesta una acción menos; con Cuenta 7 se abre tu Forma Secreta… y la Cuenta vuelve a 0.","Un suelo que nunca se apaga: la <b>Respiración Concentrada</b> añade daño de precisión por dado de arma mientras mantienes tu Postura de Respiración, y la <b>Marca del Cazador</b> a 13.º hace que todo paso Fluya durante un minuto.","<b>Estado:</b> existe una guía de diseño completa (v5), pero la clase no se ha construido ni jugado, así que este códice aún no la valora."],"rp":["Perteneces a un cuerpo que caza demonios de noche sin respaldo oficial, y el color de tu hoja es el color de tu estilo.","Un Estilo de Respiración es un linaje: un maestro, una línea de alumnos y rivales en los estilos hermanos que se separaron del tuyo.","La Respiración de la Luna es un estilo de villano; la del Sol es la que origina a todas las demás. Cuál estudias dice algo de tu historia."],"dt":"Ejercicios, respiraciones que continúan mientras duermes y largas visitas al herrero que forjó tu hoja… y que la volverá a forjar, gratis, cuando la rompas.","yes":"Disfrutas de los rompecabezas de secuencia, quieres un marcial cuyos turnos mejoran a medida que crece el combo y te gusta un estilo con una identidad visual fuerte.","no":"Quieres un turno sencillo. Cada acción te pregunta dónde estás en la rueda y cuál fue la última Forma.","est":"<b>Sin valorar.</b> Hay una guía completa en el repositorio (Docs/breath-slayer-guide-v5.md), pero la clase no se ha construido ni probado, así que todas las barras aparecen como desconocidas."}},{"id":"tarotist","hb":2,"type":null,"roles":[],"s":{"melee":null,"ranged":null,"defenses":null,"magic":null,"support":null,"healing":null,"skills":null,"questing":null,"popularity":null,"difficulty":null},"en":{"name":"Tarotist","src":"Isaac's Homebrew &middot; concept (working name)","rarity":"Concept","hp":"?","key":"?","cast":"?","armor":"?","sub":"The 22 Major Arcana (drawn, not chosen)","tag":"A card-reader whose deck deals a different hand every morning &mdash; the twenty-two Major Arcana, each a power drawn from its meaning &mdash; and who has to make the day work with whatever came up.","mech":["<b>Concept only.</b> No chassis, numbers or subclasses exist yet. Everything below describes the pitch, not rules.","Each day you draw at random from the twenty-two <b>Major Arcana</b> &mdash; The Fool, The Magician, The Tower, Death, The Star, The World &mdash; and only the cards you drew are yours until your next preparations.","Every card's power follows its meaning: The Tower as sudden ruin, Strength as endurance, The Hanged Man as a reversal, Death as an ending that is also a transformation, the Wheel of Fortune as luck itself.","The loop is the gacha. You don't choose your toolkit; you play the hand you are dealt, and building the character is deciding how to cope with a bad draw.","Open design questions: hand size, whether reversed cards exist, how much control feats grant (redraws, a signature card that is always in the hand), and how good the class is on its worst possible day."],"rp":["You read other people's futures for a living and cannot choose your own: every morning the deck tells you who you get to be today.","The cards are a conversation piece. Strangers ask for readings; allies learn to ask what you drew before they make plans.","A bad draw is a story beat, not a dead day &mdash; how your character copes with The Tower on the morning of the big fight is the roleplay."],"dt":"Reading cards for paying customers, tending the deck, and collecting stories of what each Arcanum has meant to the people you read for.","yes":"You enjoy improvisation and variance, like a character who is different every day, and find a bad hand more interesting than a reliable one.","no":"You like to plan a build and execute it. A class whose toolkit is decided by a random draw will regularly hand you the wrong tool.","est":"<b>Not rated.</b> This is an idea with a working name; there is no guide or rules text yet, so every bar and every statistic is unknown."},"es":{"name":"Tarotista","src":"Homebrew de Isaac &middot; concepto (nombre provisional)","rarity":"Concepto","hp":"?","key":"?","cast":"?","armor":"?","sub":"Los 22 Arcanos Mayores (robados, no elegidos)","tag":"Un lector de cartas al que su baraja reparte una mano distinta cada mañana —los veintidós Arcanos Mayores, cada uno un poder nacido de su significado— y que tiene que sacar el día adelante con lo que haya salido.","mech":["<b>Sólo concepto.</b> Todavía no existen chasis, números ni subclases. Todo lo que sigue describe la idea, no reglas.","Cada día robas al azar de los veintidós <b>Arcanos Mayores</b> —El Loco, El Mago, La Torre, La Muerte, La Estrella, El Mundo— y sólo las cartas que robaste son tuyas hasta tus siguientes preparaciones.","El poder de cada carta sigue su significado: La Torre como ruina repentina, La Fuerza como aguante, El Colgado como inversión, La Muerte como un final que también es transformación, La Rueda de la Fortuna como la suerte misma.","El bucle es el gacha. No eliges tus herramientas; juegas la mano que te toca, y construir el personaje es decidir cómo afrontar una mala tirada.","Preguntas de diseño abiertas: tamaño de la mano, si existen cartas invertidas, cuánto control dan las dotes (robar de nuevo, una carta propia que siempre está en la mano) y lo bueno que es la clase en su peor día posible."],"rp":["Lees el futuro de los demás para ganarte la vida y no puedes elegir el tuyo: cada mañana la baraja te dice quién puedes ser hoy.","Las cartas dan conversación. Los desconocidos piden lecturas; los aliados aprenden a preguntar qué has robado antes de hacer planes.","Una mala mano es un momento de historia, no un día perdido: cómo encaja tu personaje La Torre la mañana del gran combate es el rol."],"dt":"Echar las cartas a clientes que pagan, cuidar la baraja y coleccionar historias de lo que cada Arcano ha significado para las personas a las que lees.","yes":"Disfrutas de la improvisación y la varianza, te gusta un personaje que es distinto cada día y una mala mano te parece más interesante que una fiable.","no":"Te gusta planear una construcción y ejecutarla. Una clase cuyas herramientas decide un robo al azar te dará a menudo la herramienta equivocada.","est":"<b>Sin valorar.</b> Es una idea con nombre provisional; aún no hay guía ni texto de reglas, así que todas las barras y estadísticas son desconocidas."}}];

   '<p><b>Every base class in Pathfinder Second Edition</b> as of <i>Impossible Magic</i> (July 2026) &mdash; 29 in all &mdash; plus the <b>homebrew classes</b> of <i>Isaac&rsquo;s Homebrew</i>: four built (Saint, Soulbound, Assimilator, Stargazer) and two concepts (Breath Slayer, Tarotist). Each entry covers the mechanical engine you operate turn to turn, the character the class asks you to play, and what it does with its <b>downtime</b> between adventures.</p>'+

function axIcon(k,cls){
  return '<svg class="'+(cls||"ic")+'" viewBox="0 0 16 16" fill="none" aria-hidden="true" '+
    'stroke="var(--ax-'+k+')" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+
    ICON[k]+'</svg>';
}

var PALETTE=["#C2402C","#2F6F8F","#6E7F35","#8A5AA8","#B07A1E","#3F8A78","#A8496E","#5C6B9E"];

/* ---------------- state ---------------- */
var KEY="pf2e-codex-favs-v1", LKEY="pf2e-codex-lang";
var favs=[], state={view:"browse",q:"",roles:[],types:[],origins:[],sort:"name",current:null,lang:"en"};

function loadLang(){
  try{ var v=localStorage.getItem(LKEY); if(v==="en"||v==="es") return v; }catch(e){}
  try{ if((navigator.language||"").toLowerCase().indexOf("es")===0) return "es"; }catch(e){}
  return "en";
}
function saveLang(){ try{ localStorage.setItem(LKEY,state.lang); }catch(e){} }
function loadFavs(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw===null) return ["fighter","bard","kineticist"];
    var v=JSON.parse(raw);
    return Array.isArray(v)?v.filter(function(id){return CLASSES.some(function(c){return c.id===id})}):[];
  }catch(e){ return ["fighter","bard","kineticist"]; }
}
function saveFavs(){ try{ localStorage.setItem(KEY,JSON.stringify(favs)); }catch(e){} }
function isFav(id){ return favs.indexOf(id)>-1 }
function toggleFav(id){
  var i=favs.indexOf(id);
  if(i>-1) favs.splice(i,1); else favs.push(id);
  saveFavs(); renderAll();
}
function favColor(id){ return PALETTE[favs.indexOf(id)%PALETTE.length] }

/* ---------------- helpers ---------------- */
function $(s){ return document.querySelector(s) }
function el(tag,cls,html){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(html!==undefined) n.innerHTML=html;
  return n;
}
function L(){ return T[state.lang] }
function D(c){ return c[state.lang] }
function ax(a){ return a[state.lang] }
function typeLabel(c){ return c.type?L().type[c.type]:"?" }
function rolesLabel(c){ return c.roles.map(function(r){return L().role[r]}) }
function sv(c,k){ return c.s[k] }
function fmt(v){ return v===null?"?":v+"" }
function pct(v){ return v===null?0:(v/MAX*100) }
var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.6l6.1-.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
var STARF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.6l6.1-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
function starLabel(c){ return isFav(c.id)?L().remove+D(c).name+L().fromFav:L().add+D(c).name+L().toFav }

/* search covers both languages, so "fighter" and "guerrero" both work */
function haystack(c){
  var parts=[c.type||"",c.roles.join(" ")];
  ["en","es"].forEach(function(l){
    var d=c[l];
    parts.push(d.name,d.tag,d.src,d.key,d.cast,d.rarity,d.sub,d.mech.join(" "),d.rp.join(" "),d.dt,d.yes,d.no,
      T[l].type[c.type]||"",c.roles.map(function(r){return T[l].role[r]}).join(" "));
  });
  return parts.join(" ").replace(/<[^>]+>/g," ").toLowerCase();
}
function visible(){
  var q=state.q.trim().toLowerCase();
  var out=CLASSES.filter(function(c){
    if(state.roles.length && !state.roles.some(function(r){return c.roles.indexOf(r)>-1})) return false;
    if(state.types.length && state.types.indexOf(c.type)<0) return false;
    if(state.origins.length && state.origins.indexOf(c.hb?"homebrew":"canon")<0) return false;
    if(q && haystack(c).indexOf(q)<0) return false;
    return true;
  });
  var byName=function(a,b){return D(a).name.localeCompare(D(b).name,state.lang)};
  if(state.sort==="name") out.sort(byName);
  else{
    var k=state.sort.slice(2);
    out.sort(function(a,b){
      var x=a.s[k], y=b.s[k];
      if(x===null&&y===null) return byName(a,b);
      if(x===null) return 1; if(y===null) return -1;
      return y-x || byName(a,b);
    });
  }
  return out;
}

/* ---------------- browse ---------------- */
function chip(label,arr,key){
  var b=el("button","chip",label);
  b.setAttribute("aria-pressed", arr.indexOf(key)>-1?"true":"false");
  b.onclick=function(){
    var i=arr.indexOf(key);
    if(i>-1) arr.splice(i,1); else arr.push(key);
    renderChips(); renderList();
  };
  return b;
}
function renderChips(){
  var box=$("#chips"); box.textContent="";
  ORIGINS.forEach(function(o){ box.appendChild(chip(L().origin[o],state.origins,o)) });
  box.appendChild(el("span","sep"));
  TYPES.forEach(function(t){ box.appendChild(chip(L().type[t],state.types,t)) });
  ROLES.forEach(function(r){ box.appendChild(chip(L().role[r],state.roles,r)) });
}
function profileFor(c){
  var wrap=el("div","pf");
  wrap.setAttribute("role","img");
  wrap.setAttribute("aria-label",L().profileOf(D(c).name)+
    AXES.map(function(a){var v=sv(c,a.k);return ax(a).n+" "+(v===null?L().notRated:v+L().of+MAX)}).join(", "));
  AXES.forEach(function(a){
    var v=sv(c,a.k);
    var row=el("div","c"+(a.kind?" k-"+a.kind:""));
    row.title=ax(a).n+": "+(v===null?L().notRated:v+L().of+MAX)+" — "+ax(a).d;
    row.innerHTML=axIcon(a.k);
    row.appendChild(el("span","n",ax(a).n));
    var b=el("span","b"+(v===null?" unk":"")); var f=document.createElement("i");
    f.style.width=pct(v)+"%";
    f.style.background="var(--ax-"+a.k+")";
    b.appendChild(f); row.appendChild(b);
    row.appendChild(el("span","v",fmt(v)));
    wrap.appendChild(row);
  });
  return wrap;
}
function originBadge(c){
  if(!c.hb) return null;
  return c.hb===2?el("span","badge cn",L().cnBadge):el("span","badge hb",L().hbBadge);
}
function renderList(){
  var list=$("#list"); list.textContent="";
  var items=visible();
  $("#resultN").textContent=L().shown(items.length);
  if(!items.length){ list.appendChild(el("div","empty",L().empty)); return; }
  items.forEach(function(c){
    var d=D(c);
    var row=el("div","row");
    var main=el("div");
    var nm=el("div","nm"); nm.appendChild(document.createTextNode(d.name));
    if(state.lang==="es" && c.es.name!==c.en.name) nm.appendChild(el("span","ennm",c.en.name));
    nm.appendChild(el("span","badge k",typeLabel(c)));
    var ob=originBadge(c); if(ob) nm.appendChild(ob);
    main.appendChild(nm);
    main.appendChild(el("div","tl",d.tag));
    var meta=el("div","meta");
    rolesLabel(c).forEach(function(r){ meta.appendChild(el("span","badge",r)) });
    if(meta.childNodes.length) main.appendChild(meta);
    main.appendChild(profileFor(c));
    var open=el("button","rowopen");
    open.appendChild(main);
    open.setAttribute("aria-label",L().open+d.name);
    open.onclick=function(){ openDetail(c.id) };
    var st=el("button","star",isFav(c.id)?STARF:STAR);
    st.setAttribute("aria-pressed",isFav(c.id)?"true":"false");
    st.setAttribute("aria-label",starLabel(c));
    st.onclick=function(ev){ ev.stopPropagation(); toggleFav(c.id) };
    row.appendChild(open); row.appendChild(st);
    list.appendChild(row);
  });
}

/* ---------------- detail ---------------- */
function barsFor(c){
  var wrap=el("div","bars");
  AXES.forEach(function(a){
    var v=sv(c,a.k);
    var b=el("div","bar"+(a.kind?" k-"+a.kind:""));
    b.innerHTML=axIcon(a.k);
    b.appendChild(el("span","lb",ax(a).n+(a.kind?"<em>"+(a.kind==="cost"?L().cost:L().meta)+"</em>":"")));
    var tk=el("span","tk"+(v===null?" unk":"")); var f=document.createElement("i");
    f.style.width=pct(v)+"%";
    f.style.background="var(--ax-"+a.k+")";
    tk.appendChild(f); b.appendChild(tk);
    b.appendChild(el("span","vl",fmt(v)+" / "+MAX));
    b.title=ax(a).d;
    wrap.appendChild(b);
  });
  return wrap;
}
function hpText(d){ return d.hp==="?"?"?":d.hp+" + Con" }
function openDetail(id){
  var c=CLASSES.filter(function(x){return x.id===id})[0], d=D(c);
  state.current=id;
  var box=$("#detailBody"); box.textContent="";

  var head=el("div","dhead");
  var left=el("div");
  left.appendChild(el("div","src",d.src+" &middot; "+typeLabel(c)+" &middot; "+d.rarity));
  var h=el("h2"); h.textContent=d.name; left.appendChild(h);
  if(state.lang==="es" && c.es.name!==c.en.name) left.appendChild(el("div","enname",L().enName+"<b>"+c.en.name+"</b>"));
  left.appendChild(el("div","tag",d.tag));
  head.appendChild(left);
  var st=el("button","star",isFav(id)?STARF:STAR);
  st.setAttribute("aria-pressed",isFav(id)?"true":"false");
  st.setAttribute("aria-label",starLabel(c));
  st.onclick=function(){ toggleFav(id); openDetail(id) };
  head.appendChild(st);
  box.appendChild(head);

  var sg=el("dl","statgrid");
  [hpText(d),d.key,d.cast,d.armor,d.sub,d.rarity].forEach(function(v,i){
    var cell=el("div");
    cell.appendChild(el("dt",null,L().grid[i]));
    cell.appendChild(el("dd",null,v));
    sg.appendChild(cell);
  });
  box.appendChild(sg);

  if(c.hb){
    var note=el("div","note");
    note.appendChild(el("p",null,"<strong>"+L().estHead+"</strong>"+d.est));
    box.appendChild(note);
  }

  [[L().engine,d.mech],[L().table,d.rp]].forEach(function(p){
    var s=el("section","sec"); s.appendChild(el("h3",null,p[0]));
    var ul=el("ul","bullets");
    p[1].forEach(function(m){ ul.appendChild(el("li",null,m)) });
    s.appendChild(ul); box.appendChild(s);
  });

  var s2b=el("section","sec"); s2b.appendChild(el("h3",null,L().downtime));
  s2b.appendChild(el("p","dtbody",d.dt));
  box.appendChild(s2b);

  var v=el("div","verdict");
  v.appendChild(el("p","yes","<strong>"+L().playIf+"</strong>"+d.yes));
  v.appendChild(el("p","no","<strong>"+L().skipIf+"</strong>"+d.no));
  box.appendChild(v);

  var s3=el("section","sec"); s3.appendChild(el("h3",null,L().profile));
  s3.appendChild(barsFor(c));
  s3.appendChild(el("p","axhelp",c.hb?L().axhelpHb:L().axhelp));
  box.appendChild(s3);

  setView("detail");
  window.scrollTo(0,0);
}

/* ---------------- compare ---------------- */
function renderCompare(){
  var box=$("#cmpBody"); box.textContent="";
  var picked=favs.map(function(id){
    return CLASSES.filter(function(c){return c.id===id})[0];
  }).filter(Boolean);

  if(!picked.length){ box.appendChild(el("div","empty",L().noFav)); return; }

  var intro=el("div","cmp-intro");
  intro.appendChild(el("p","axhelp",picked.length===1?L().oneFav:L().manyFav(picked.length)));
  box.appendChild(intro);

  var lg=el("div","legend");
  picked.forEach(function(c){
    var s=el("span");
    var i=document.createElement("i"); i.style.background=favColor(c.id);
    s.appendChild(i); s.appendChild(document.createTextNode(D(c).name));
    lg.appendChild(s);
  });
  box.appendChild(lg);

  var ab=el("div","axblock");
  AXES.forEach(function(a){
    var g=el("div","ax");
    g.appendChild(el("h4",null,axIcon(a.k)+"<span>"+ax(a).n+"</span>"+
      (a.kind?"<em>"+(a.kind==="cost"?L().cost:L().meta)+"</em>":"")));
    var grp=el("div","grp");
    picked.forEach(function(c){
      var v=sv(c,a.k);
      var r=el("div","g");
      var t=el("div","gt"+(v===null?" unk":"")); var f=document.createElement("i");
      f.style.width=pct(v)+"%";
      f.style.background=favColor(c.id);
      if(a.kind) f.style.opacity=a.kind==="cost"?".42":".7";
      t.appendChild(f); t.title=D(c).name+": "+ax(a).n+" "+(v===null?L().notRated:v+L().of+MAX);
      r.appendChild(t);
      r.appendChild(el("div","gv",fmt(v)));
      grp.appendChild(r);
    });
    g.appendChild(grp);
    ab.appendChild(g);
  });
  box.appendChild(ab);

  if(picked.length>1) box.appendChild(el("div","scrollhint",L().scroll));

  var R=L().rows;
  var rows=[
    [R[0],function(c,d){return d.tag},true],
    [R[1],function(c,d){return d.src+" &middot; "+d.rarity}],
    [R[2],function(c,d){return typeLabel(c)+(c.roles.length?" &middot; "+rolesLabel(c).join(", "):"")}],
    [R[3],function(c,d){return hpText(d)}],
    [R[4],function(c,d){return d.key}],
    [R[5],function(c,d){return d.cast}],
    [R[6],function(c,d){return d.armor}],
    [R[7],function(c,d){return d.sub}],
    [R[8],function(c,d){return d.mech[0]}],
    [R[9],function(c,d){return d.rp[0]}],
    [R[10],function(c,d){return d.dt},true],
    [R[11],function(c,d){return d.yes},true],
    [R[12],function(c,d){return d.no}]
  ];
  var wrap=el("div","tblwrap");
  var t=el("table","cmpt");
  var thead=el("thead"); var htr=el("tr");
  htr.appendChild(el("th",null,"&nbsp;"));
  picked.forEach(function(c){
    var th=el("th");
    var sw=el("span","swatch"); sw.style.background=favColor(c.id);
    th.appendChild(sw); th.appendChild(document.createTextNode(D(c).name));
    htr.appendChild(th);
  });
  thead.appendChild(htr); t.appendChild(thead);
  var tb=el("tbody");
  rows.forEach(function(r){
    var tr=el("tr");
    tr.appendChild(el("th",null,r[0]));
    picked.forEach(function(c){ tr.appendChild(el("td",r[2]?"hi":null,r[1](c,D(c)))) });
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); box.appendChild(wrap);
}

/* ---------------- views ---------------- */
function setView(v){
  state.view=v;
  $("#viewBrowse").classList.toggle("hidden",v!=="browse");
  $("#viewDetail").classList.toggle("hidden",v!=="detail");
  $("#viewCompare").classList.toggle("hidden",v!=="compare");
  $("#tabBrowse").setAttribute("aria-selected",v!=="compare"?"true":"false");
  $("#tabCompare").setAttribute("aria-selected",v==="compare"?"true":"false");
}
function renderAll(){
  $("#favCnt").textContent=favs.length?favs.length:"";
  renderList();
  renderCompare();
  if(state.view==="detail"&&state.current){
    var st=$("#detailBody .star");
    if(st){
      st.innerHTML=isFav(state.current)?STARF:STAR;
      st.setAttribute("aria-pressed",isFav(state.current)?"true":"false");
    }
  }
}

/* ---------------- language ---------------- */
function renderStatic(){
  var l=L();
  document.documentElement.lang=state.lang;
  document.title=l.title;
  $("#h1").textContent=l.title;
  $("#rosterN").textContent=l.roster(CLASSES.length);
  $("#tabBrowse").textContent=l.tabBrowse;
  $("#tabCompareLbl").textContent=l.tabCompare;
  $("#q").placeholder=l.q;
  $("#sortLbl").textContent=l.sort;
  $("#back").textContent=l.back;
  $("#about").innerHTML=l.about;
  $("#axKey").innerHTML=AXES.map(function(a){ return "<span>"+axIcon(a.k)+ax(a).n+"</span>" }).join("");
  var sel=$("#sort"); sel.textContent="";
  [["name",l.byName]].concat(AXES.map(function(a){return ["s:"+a.k,ax(a).n+l.high]}))
   .forEach(function(o){
     var op=document.createElement("option"); op.value=o[0]; op.textContent=o[1]; sel.appendChild(op);
   });
  sel.value=state.sort;
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(b){
    b.setAttribute("aria-pressed",b.getAttribute("data-lang")===state.lang?"true":"false");
  });
}
function setLang(lang){
  state.lang=lang; saveLang();
  renderStatic(); renderChips(); renderAll();
  if(state.view==="detail"&&state.current){ var y=window.scrollY; openDetail(state.current); window.scrollTo(0,y); }
}

/* ---------------- init ---------------- */
state.lang=loadLang();
favs=loadFavs();
$("#sort").onchange=function(){ state.sort=this.value; renderList() };
$("#q").oninput=function(e){ state.q=e.target.value; renderList() };
$("#tabBrowse").onclick=function(){ setView("browse") };
$("#tabCompare").onclick=function(){ setView("compare"); window.scrollTo(0,0) };
$("#back").onclick=function(){ setView("browse") };
Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(b){
  b.onclick=function(){ setLang(b.getAttribute("data-lang")) };
});
renderStatic();
renderChips();
renderAll();
setView("browse");

</script>
</body>
</html>
