en daño."],"rp":["Los investigadores no pueden dejar un enigma en paz. Cada conversación se vuelve un interrogatorio y cada escena suelta un hilo del que tirar, sea relevante o no.","Idear una estratagema es rol disfrazado de regla: mecánicamente estás prediciendo el resultado, y decirlo en voz alta es el placer de la clase.","Tus aliados cuentan contigo para resolver casos; a algunos las deducciones constantes les agotan aunque se apoyen del todo en ellas."],"dt":"El tiempo libre parece formación continua: estudiar materias nuevas y viejas, cultivar contactos que trafican con información, mantener la mente ocupada. Bastantes se sacan un dinero como detective privado o asesorando a la guardia local, porque son exactamente las mismas destrezas.","yes":"Quieres ser la persona más lista de la sala, tu DJ dirige misterios y te gusta conocer el resultado antes de comprometerte.","no":"Tu campaña es puro mazmorreo. Buena parte de esta clase apunta a problemas que un juego solo de combate no te va a plantear."}},{"id":"kineticist","hb":0,"type":"Hybrid","roles":["Striker","Controller","Defender"],"s":{"melee":3,"ranged":4,"defenses":3,"magic":3,"support":3,"healing":3,"skills":1,"questing":2,"popularity":5,"difficulty":3},"en":{"name":"Kineticist","src":"Rage of Elements","rarity":"Common","hp":"8","key":"Constitution","cast":"None &mdash; impulses are at-will","armor":"Light &amp; medium","sub":"Kinetic Gate","tag":"Elemental power with no spell slots at all: everything you can do, you can do every round, forever.","mech":["A <b>kinetic gate</b> in your body channels one or two of air, earth, fire, metal, water and wood. There is no daily preparation and no spell economy.","<b>Impulses</b> are at-will, fuelled by activating your <b>kinetic aura</b> each encounter. <span class=\"act\">&#9670;</span> Elemental Blast is your reliable attack at range or in melee.","Bigger impulses carry the <b>overflow</b> trait, which shuts the aura down until you spend an action to bring it back &mdash; a built-in cost where a big swing eats your next setup.","<b>Gate's Threshold</b> lets you deepen one element or branch into a second as you level.","<b>Constitution is your key attribute</b> &mdash; the only class where the casting stat is also the health stat, which makes kineticists far tougher than any other magic user."],"rp":["Many kineticists have a fraught origin around the moment their gate opened, sometimes traumatic, and carry lingering unease about power they do not fully control.","Your element tends to colour your whole personality: fiery temper, rock stubbornness, water's easy adaptability.","Others alternate between awe at the raw elemental power and quiet worry that it might consume you."],"dt":"Kineticists use quiet stretches to commune with their element and practise controlling the gate more precisely. When they want the power to express itself differently, retraining is a matter of realigning the flow of that gate rather than simply resting.","yes":"You want to sling elemental power every single round without tracking a slot, and to be durable doing it.","no":"You want a spell list's flexibility. Kineticist options are fixed at build time and cannot be swapped day to day."},"es":{"name":"Kineticista","src":"Rage of Elements","rarity":"Común","hp":"8","key":"Constitución","cast":"Ninguno — los impulsos son a voluntad","armor":"Ligera y media","sub":"Portal cinético","tag":"Poder elemental sin un solo espacio de conjuro: todo lo que sabes hacer puedes hacerlo cada asalto, siempre.","mech":["Un <b>portal cinético</b> en tu cuerpo canaliza uno o dos de entre aire, tierra, fuego, metal, agua y madera. No hay preparación diaria ni economía de conjuros.","Los <b>impulsos</b> son a voluntad, alimentados por activar tu <b>aura cinética</b> en cada encuentro. <span class=\"act\">&#9670;</span> Descarga elemental es tu ataque fiable, a distancia o cuerpo a cuerpo.","Los impulsos grandes tienen el rasgo <b>desbordamiento</b>, que apaga el aura hasta que gastas una acción en recuperarla: un coste integrado por el que un golpe grande se come tu siguiente preparación.","El <b>Umbral del portal</b> te deja profundizar en un elemento o ramificarte hacia un segundo según subes de nivel.","<b>Constitución es tu atributo clave</b>: la única clase donde el atributo de lanzamiento es también el de salud, lo que hace a los kineticistas mucho más duros que cualquier otro usuario de magia."],"rp":["Muchos kineticistas arrastran un origen turbulento en el momento en que se abrió su portal, a veces traumático, y cierta inquietud persistente por un poder que no controlan del todo.","Tu elemento suele teñir la personalidad entera: temperamento de fuego, terquedad de piedra, adaptabilidad fácil del agua.","Los demás alternan entre el asombro ante ese poder elemental crudo y el temor callado de que acabe consumiéndote."],"dt":"Los kineticistas usan los ratos tranquilos para comulgar con su elemento y practicar un control más fino del portal. Cuando quieren que el poder se exprese de otra manera, reentrenar consiste en realinear el flujo de ese portal, no simplemente en descansar.","yes":"Quieres lanzar poder elemental cada asalto sin llevar cuenta de nada, y ser resistente mientras lo haces.","no":"Quieres la flexibilidad de una lista de conjuros. Las opciones del kineticista se fijan al construir y no se cambian día a día."}},{"id":"magus","hb":0,"type":"Hybrid","roles":["Striker"],"s":{"melee":4,"ranged":3,"defenses":3,"magic":3,"support":1,"healing":0,"skills":2,"questing":2,"popularity":2,"difficulty":3},"en":{"name":"Magus","src":"Impossible Magic","rarity":"Common","hp":"8","key":"Strength or Dexterity","cast":"Arcane (prepared, few slots)","armor":"Light &amp; medium","sub":"Hybrid Study","tag":"Sword and spell in the same swing, built around one enormous alpha strike.","mech":["<span class=\"act\">&#9670;&#9670;</span> <b>Spellstrike</b> casts an attack or save-based spell directly into a weapon Strike and resolves both at once. A critical hit means a critically-hit spell &mdash; the biggest single numbers in the game.","Spellstrike must <b>recharge</b> between uses, so the loop is strike, rebuild, strike. Managing that cadence is the entire skill of the class.","<span class=\"act\">&#9670;</span> <b>Arcane Cascade</b> is a stance you enter after casting, adding force damage to your melee Strikes &mdash; it keeps your non-Spellstrike rounds worthwhile.","You have <b>very few spell slots</b>. They are ammunition for Spellstrike rather than a caster's toolkit, and choosing what to load is the real preparation.","Your <b>Hybrid Study</b> sets your shape: laughing shadow for darting mobility, twofold tine for a familiar-assisted variant, and others for two-handed, shield or ranged builds."],"rp":["Magi are perpetual students trying to master two demanding disciplines at once, and often overreach by taking on too many projects at the same time.","The hybrid study reads as a school or tradition, which makes for good backstory: who taught you, what the form is called, who else practises it.","There is a natural arrogance to the fantasy, and it plays beautifully &mdash; a magus knows their alpha strike is the best thing at the table, and is usually right."],"dt":"True to the dual nature, magi split downtime between both halves of the training: researching spells and crafting magic items on one side, retraining combat techniques and drilling new manoeuvres on the other. Neither discipline gets to fully rest.","yes":"You want to build toward one devastating moment per fight and enjoy the setup as much as the payoff.","no":"You want to cast as a caster does. Mistiming the recharge wastes whole rounds."},"es":{"name":"Magus","src":"Impossible Magic","rarity":"Común","hp":"8","key":"Fuerza o Destreza","cast":"Arcana (preparada, pocos espacios)","armor":"Ligera y media","sub":"Estudio híbrido","tag":"Espada y conjuro en el mismo mandoble, construido alrededor de un único golpe demoledor.","mech":["<span class=\"act\">&#9670;&#9670;</span> <b>Golpe de conjuro</b> lanza un conjuro de ataque o de salvación directamente dentro de un Ataque con arma y resuelve ambos a la vez. Un crítico implica un conjuro crítico: los números más altos del juego.","Golpe de conjuro debe <b>recargarse</b> entre usos, así que el bucle es golpear, rehacerse, golpear. Gestionar esa cadencia es toda la destreza de la clase.","<span class=\"act\">&#9670;</span> <b>Cascada arcana</b> es una postura en la que entras tras lanzar y que añade daño de fuerza a tus ataques cuerpo a cuerpo: es lo que hace que valgan la pena los asaltos sin Golpe de conjuro.","Tienes <b>muy pocos espacios de conjuro</b>. Son munición para el Golpe de conjuro, no una caja de herramientas de lanzador, y elegir qué cargar es la preparación de verdad.","Tu <b>estudio híbrido</b> fija tu forma: sombra risueña para moverte y desaparecer, púa doble para una variante asistida por familiar, y otros para dos manos, escudo o distancia."],"rp":["Los magus son estudiantes perpetuos intentando dominar dos disciplinas exigentes a la vez, y suelen excederse aceptando demasiados proyectos simultáneos.","El estudio híbrido se lee como una escuela o tradición, lo que da buen trasfondo: quién te enseñó, cómo se llama la forma, quién más la practica.","Hay una arrogancia natural en la fantasía, y se interpreta de maravilla: un magus sabe que su golpe inicial es lo mejor que puede pasar en la mesa, y suele tener razón."],"dt":"Fiel a su naturaleza doble, el magus reparte el tiempo libre entre las dos mitades de su formación: investigar conjuros y fabricar objetos mágicos por un lado; reentrenar técnicas de combate y practicar maniobras nuevas por el otro. Ninguna de las dos disciplinas llega a descansar.","yes":"Quieres construir hacia un momento demoledor por combate y disfrutas de la preparación tanto como del desenlace.","no":"Quieres lanzar como lanza un lanzador. Calcular mal la recarga desperdicia asaltos enteros."}},{"id":"monk","hb":0,"type":"Martial","roles":["Striker","Defender"],"s":{"melee":4,"ranged":2,"defenses":4,"magic":1,"support":2,"healing":0,"skills":1,"questing":1,"popularity":3,"difficulty":2},"en":{"name":"Monk","src":"Player Core 2","rarity":"Common","hp":"10","key":"Strength or Dexterity","cast":"Optional qi focus spells","armor":"Unarmored (best in game)","sub":"Stances","tag":"Three attacks a turn, the best unarmoured defence in the game, and stances that rewrite your options.","mech":["<span class=\"act\">&#9670;</span> <b>Flurry of Blows</b> gives two unarmed Strikes for one action, so a monk turn routinely holds three attacks and still has room to move.","<b>Unarmoured defence</b> climbs to legendary &mdash; the best AC progression in the game &mdash; and costs you nothing but a good Dexterity.","<b>Stances</b> are the subclass in practice: small mid-combat toggles that change your fighting style from round to round rather than one big resource.","<b>Incredible Movement</b> makes you the fastest character on the board without magic, and <b>Path to Perfection</b> turns one, then two, then three saves into near-unbeatable defences.","<b>Qi spells</b> are optional focus spells powered by inner energy &mdash; teleporting strikes, elemental bursts, flight &mdash; if you want a supernatural layer."],"rp":["Monks pair rigorous physical training with genuine philosophical practice: meditation, self-discipline, calm under pressure.","You often end up the party's unofficial counsellor, the one people bring a hard decision to.","Others are amazed by the physical feats but sometimes find the vows and constant equanimity a little uptight."],"dt":"A monk's downtime is disciplined by design: diligent exercise, careful eating, meditation and continued study of whatever philosophy they follow. Many also take up a craft they intend to perfect, treating it as another form of the same lifelong self-improvement.","yes":"You want mobility, a high AC, and multiple attacks without needing gear to make it work.","no":"You want the biggest single hit. Monks trade per-hit damage for volume and positioning."},"es":{"name":"Monje","src":"Player Core 2","rarity":"Común","hp":"10","key":"Fuerza o Destreza","cast":"Conjuros de enfoque qi opcionales","armor":"Sin armadura (la mejor del juego)","sub":"Posturas","tag":"Tres ataques por turno, la mejor defensa sin armadura del juego y posturas que reescriben tus opciones.","mech":["<span class=\"act\">&#9670;</span> <b>Ráfaga de golpes</b> da dos Ataques sin armas por una sola acción, así que un turno de monje contiene tres ataques y aún deja sitio para moverse.","La <b>defensa sin armadura</b> sube hasta legendaria —la mejor progresión de CA del juego— y no te cuesta más que una buena Destreza.","Las <b>posturas</b> son la subclase en la práctica: interruptores pequeños a mitad de combate que cambian tu estilo de un asalto a otro en lugar de un único recurso grande.","<b>Movimiento increíble</b> te convierte en el personaje más rápido del tablero sin magia, y la <b>Senda a la perfección</b> convierte una, luego dos y luego tres de tus salvaciones en defensas casi inexpugnables.","Los <b>conjuros qi</b> son conjuros de enfoque opcionales alimentados por energía interior —golpes que teletransportan, estallidos elementales, vuelo— si quieres una capa sobrenatural."],"rp":["Los monjes combinan entrenamiento físico riguroso con práctica filosófica real: meditación, autodisciplina, calma bajo presión.","Sueles acabar de consejero extraoficial del grupo, la persona a la que se lleva una decisión difícil.","Los demás alucinan con las proezas físicas, pero a veces encuentran los votos y la ecuanimidad constante un poco rígidos."],"dt":"El tiempo libre de un monje es disciplinado por diseño: ejercicio diligente, alimentación cuidada, meditación y estudio continuado de la filosofía que siga. Muchos además cultivan un oficio que pretenden perfeccionar, tratándolo como otra forma de la misma mejora personal de por vida.","yes":"Quieres movilidad, CA alta y varios ataques sin depender del equipo para que funcione.","no":"Quieres el golpe único más grande. El monje cambia daño por impacto a cambio de volumen y posicionamiento."}},{"id":"necromancer","hb":0,"type":"Caster","roles":["Controller","Striker"],"s":{"melee":3,"ranged":3,"defenses":2,"magic":3,"support":3,"healing":2,"skills":3,"questing":2,"popularity":3,"difficulty":4},"en":{"name":"Necromancer","src":"Impossible Magic","rarity":"Common","hp":"8","key":"Intelligence","cast":"Occult (prepared)","armor":"Light","sub":"Fatal Method &amp; Grim Fascination","tag":"A prepared occult caster who floods the field with cheap, expendable bodies.","mech":["<b>Thralls</b> are the engine: disposable 1-HP mindless undead you raise to flank, distract, body-block, or be sacrificed outright for Focus Points. Weak individually, numerous and free.","<b>Mastery of Life and Death</b> lets you freely swap the void and vitality damage types on your spells &mdash; the same spell can heal an undead ally or hurt a living enemy as needed.","You are a full <b>prepared occult</b> caster on top of that, with the tradition's usual talent for doing terrible things to minds.","Your <b>fatal method</b> &mdash; Puppeteer for thrall-swarming, Reaper for direct combat &mdash; and your <b>grim fascination</b> together set your specialty.","The challenge is action economy: thralls need directing, and balancing your own casting against commanding the horde is what the class asks you to master."],"rp":["Necromancers study death with genuine fascination rather than nihilism &mdash; anatomy, mortality, the border between life and undeath.","Some chase forbidden knowledge to cheat death outright, for themselves or for someone they have lost.","Others misread the fascination as cruelty or morbid glee; a few seek you out instead, hoping for a way to speak with their dead."],"dt":"Necromancers brew potions, craft items and scribe scrolls for the party while chasing hidden or locked-away knowledge tied to their grim fascination. Some quietly take on the role of graveyard caretaker &mdash; making sure the dead in their care actually stay that way.","yes":"You want a full caster with a swarm of disposable bodies, and a class the party may need to argue about.","no":"You want to be uncomplicatedly welcome in town, or dislike managing extra creatures on your turn."},"es":{"name":"Nigromante","src":"Impossible Magic","rarity":"Común","hp":"8","key":"Inteligencia","cast":"Oculta (preparada)","armor":"Ligera","sub":"Método fatal y fascinación macabra","tag":"Un lanzador oculto preparado que inunda el campo de cuerpos baratos y prescindibles.","mech":["Los <b>siervos</b> son el motor: muertos vivientes descerebrados de 1 punto de golpe que alzas para flanquear, distraer, hacer de muro o sacrificar directamente por Puntos de enfoque. Débiles de uno en uno, numerosos y gratis.","<b>Maestría de la vida y la muerte</b> te deja intercambiar libremente los tipos de daño de vacío y vitalidad en tus conjuros: el mismo conjuro puede curar a un aliado no muerto o herir a un enemigo vivo.","Encima de todo eso eres un lanzador <b>oculto preparado</b> completo, con el talento habitual de la tradición para hacerle cosas terribles a las mentes.","Tu <b>método fatal</b> —Titiritero para enjambrar siervos, Segador para el combate directo— y tu <b>fascinación macabra</b> fijan juntos tu especialidad.","El reto es la economía de acciones: los siervos hay que dirigirlos, y equilibrar tu propio lanzamiento con el mando de la horda es lo que la clase te pide dominar."],"rp":["Los nigromantes estudian la muerte con fascinación genuina, no con nihilismo: anatomía, mortalidad, la frontera entre vida y no-vida.","Algunos persiguen conocimiento prohibido para burlar la muerte sin más, por sí mismos o por alguien a quien perdieron.","Otros malinterpretan esa fascinación como crueldad o regodeo; unos pocos te buscan precisamente esperando una forma de hablar con sus muertos."],"dt":"Los nigromantes preparan pociones, fabrican objetos y transcriben pergaminos para el grupo mientras persiguen conocimiento oculto o encerrado relacionado con su fascinación macabra. Algunos asumen discretamente el papel de guardián del cementerio, asegurándose de que los muertos a su cargo sigan estándolo.","yes":"Quieres un lanzador completo con un enjambre de cuerpos prescindibles, y una clase sobre la que el grupo quizá tenga que discutir.","no":"Quieres ser bienvenido sin complicaciones en el pueblo, o te disgusta gestionar criaturas extra en tu turno."}},{"id":"oracle","hb":0,"type":"Caster","roles":["Support","Controller","Striker"],"s":{"melee":2,"ranged":3,"defenses":2,"magic":5,"support":4,"healing":3,"skills":2,"questing":4,"popularity":1,"difficulty":5},"en":{"name":"Oracle","src":"Player Core 2","rarity":"Common","hp":"8","key":"Charisma","cast":"Divine (spontaneous)","armor":"Light","sub":"Mystery","tag":"Divine power without a deity, and a curse that deepens every time you reach for it.","mech":["You are a <b>spontaneous divine</b> caster with an unusually large repertoire &mdash; three spells per day at 1st level, more than most spontaneous casters &mdash; plus Signature Spells for flexible heightening.","Your <b>Mystery</b> &mdash; Ancestors, Bones, Cosmos, Flames, Life, Lore, Tides and others &mdash; supplies revelation spells, extra spells on your list and a granted skill. Each plays like a different class.","<b>Cursebound</b> abilities grant strong immediate benefits at the price of stacking a mystery-specific curse on yourself, which only clears when you <b>Refocus</b>.","That makes every fight a live risk calculation: how hard do you lean on your own power before the cost outweighs it?","The Remaster rebuilt this as a choice rather than a punishment, so a modern oracle chooses to be cursed, repeatedly, on purpose."],"rp":["The oracle did not apply for this. Power arrived uninvited and brought a condition with it &mdash; the most inherently dramatic premise of any caster.","Your curse is visible, and most onlookers misread it as evidence of some past sin rather than the true price of tapping forces beyond ordinary religion.","Some embrace the mystery as a sacred calling; others treat it as a punishment they have learned to live with. People who understand what they are seeing respect the sacrifice."],"dt":"Oracles dig further into their mystery and the divine wellsprings behind it, and many find the curse easier to live with alongside others who share the same interest. Some align with an organised religion built around their mystery &mdash; or start a following of their own devoted to it.","yes":"You want spontaneous divine casting with a built-in dramatic engine, and a character whose power visibly costs them.","no":"You want clean, predictable resources. The oracle deliberately attaches a penalty to its best options."},"es":{"name":"Oráculo","src":"Player Core 2","rarity":"Común","hp":"8","key":"Carisma","cast":"Divina (espontánea)","armor":"Ligera","sub":"Misterio","tag":"Poder divino sin deidad, y una maldición que se agrava cada vez que echas mano de él.","mech":["Eres un lanzador <b>divino espontáneo</b> con un repertorio inusualmente amplio —tres conjuros al día a nivel 1, más que la mayoría de lanzadores espontáneos— y conjuros distintivos para intensificar con flexibilidad.","Tu <b>misterio</b> —Antepasados, Huesos, Cosmos, Llamas, Vida, Saber, Mareas y otros— aporta conjuros de revelación, conjuros extra en tu lista y una habilidad concedida. Cada uno se juega como una clase distinta.","Las capacidades <b>malditas</b> conceden beneficios inmediatos potentes al precio de acumular sobre ti una maldición propia del misterio, que solo se limpia al <b>Reenfocar</b>.","Eso convierte cada combate en un cálculo de riesgo en vivo: ¿hasta dónde apoyarse en tu propio poder antes de que el coste supere al beneficio?","El Remaster lo reconstruyó como elección y no como castigo, así que un oráculo moderno elige estar maldito, una y otra vez, a propósito."],"rp":["El oráculo no pidió esto. El poder llegó sin invitación y trajo una condición consigo: la premisa más dramática de cualquier lanzador.","Tu maldición es visible, y la mayoría la malinterpreta como prueba de algún pecado pasado en vez de como el precio real de tocar fuerzas más allá de la religión ordinaria.","Unos abrazan el misterio como una vocación sagrada; otros lo tratan como un castigo con el que han aprendido a convivir. Quien entiende lo que ve, respeta el sacrificio."],"dt":"Los oráculos ahondan en su misterio y en las fuentes divinas que lo alimentan, y a muchos les resulta más llevadera la maldición junto a otros que comparten el mismo interés. Algunos se alinean con una religión organizada construida en torno a su misterio, o fundan un seguimiento propio dedicado a él.","yes":"Quieres lanzamiento divino espontáneo con un motor dramático incorporado, y un personaje cuyo poder le cuesta algo visible.","no":"Quieres recursos limpios y predecibles. El oráculo asocia a propósito una penalización a sus mejores opciones."}},{"id":"psychic","hb":0,"type":"Caster","roles":["Striker","Controller"],"s":{"melee":2,"ranged":4,"defenses":1,"magic":4,"support":2,"healing":1,"skills":3,"questing":3,"popularity":1,"difficulty":4},"en":{"name":"Psychic","src":"Dark Archive","rarity":"Common","hp":"6","key":"Intelligence or Charisma","cast":"Occult (spontaneous)","armor":"Unarmored","sub":"Conscious &amp; Subconscious Mind","tag":"Half the spell slots, extraordinary cantrips, and a burst button that briefly makes you terrifying.","mech":["You have roughly <b>half the spell slots</b> of a normal caster. In exchange your <b>psi cantrips</b> are real weapons, boosted by Focus-Point <b>amps</b> that make a cantrip behave like a proper spell.","<span class=\"act\">&#9670;</span> <b>Unleash Psyche</b> is the burst: triggered at the start of a turn after casting the turn before, it juices your spell damage for two rounds and leaves you stupefied while the mind recovers.","That gives a rhythm no other caster has &mdash; conserve, unleash, weather the comedown. Choosing the right two rounds is the whole game.","Your <b>conscious mind</b> picks your cantrips and aesthetic; your <b>subconscious mind</b> grants a focus spell and decides whether you key off Intelligence or Charisma.","<b>6 hit points per level</b> and no armour proficiency: the lowest-HP full caster in the game, and it must be played from behind something."],"rp":["Psychic magic is unsettling in Golarion. It comes from inside a person, has no tradition behind it, and is usually something that happened rather than something learned.","You treat the workings of your own mind as endlessly fascinating territory, sometimes preferring mental contact or subtle telekinesis when ordinary methods would do.","Others find it awe-inspiring but struggle to accept it as the same kind of magic &mdash; a few wonder uneasily whether you are something other than human underneath."],"dt":"Psychics keep exploring the depths of their own mind, hunting new spells and phenomena, because deeper self-understanding translates directly into more power. Retraining becomes a way of literally testing the limits of their own adaptability as that understanding shifts.","yes":"You want cantrip-based casting you can use forever, punctuated by short windows of enormous power.","no":"You want a broad prepared toolkit, or cannot reliably stay out of melee &mdash; this class dies quickly."},"es":{"name":"Psíquico","src":"Dark Archive","rarity":"Común","hp":"6","key":"Inteligencia o Carisma","cast":"Oculta (espontánea)","armor":"Sin armadura","sub":"Mente consciente y subconsciente","tag":"La mitad de espacios de conjuro, trucos extraordinarios y un botón de estallido que te vuelve aterrador un instante.","mech":["Tienes aproximadamente <b>la mitad de espacios de conjuro</b> que un lanzador normal. A cambio, tus <b>trucos psi</b> son armas de verdad, potenciados por <b>amplificaciones</b> de Punto de enfoque que hacen que un truco se comporte como un conjuro real.","<span class=\"act\">&#9670;</span> <b>Desatar la psique</b> es el estallido: se activa al empezar un turno tras haber lanzado el anterior, potencia tu daño durante dos asaltos y te deja estupefacto mientras la mente se recupera.","Eso da un ritmo que ningún otro lanzador tiene: conservar, desatar, aguantar la resaca. Elegir los dos asaltos correctos es todo el juego.","Tu <b>mente consciente</b> elige tus trucos y tu estética; tu <b>mente subconsciente</b> concede un conjuro de enfoque y decide si tu atributo clave es Inteligencia o Carisma.","<b>6 puntos de golpe por nivel</b> y ninguna competencia con armadura: el lanzador completo más frágil del juego, y hay que jugarlo desde detrás de algo."],"rp":["La magia psíquica inquieta en Golarion. Sale de dentro de una persona, no tiene tradición detrás y suele ser algo que ocurrió, no algo que se aprendió.","Tratas el funcionamiento de tu propia mente como territorio fascinante, y a veces prefieres el contacto mental o la telequinesis sutil aunque bastara con lo normal.","A los demás les impresiona, pero les cuesta aceptarlo como el mismo tipo de magia; unos pocos se preguntan, incómodos, si por debajo eres otra cosa."],"dt":"Los psíquicos siguen explorando las profundidades de su propia mente, buscando conjuros y fenómenos nuevos, porque entenderse mejor a uno mismo se traduce directamente en más poder. Reentrenar se vuelve una forma de poner a prueba literalmente los límites de su propia adaptabilidad conforme cambia esa comprensión.","yes":"Quieres lanzamiento basado en trucos que puedas usar siempre, salpicado de ventanas breves de poder enorme.","no":"Quieres una caja de herramientas preparada amplia, o no puedes mantenerte fuera del cuerpo a cuerpo con fiabilidad: esta clase muere rápido."}},{"id":"ranger","hb":0,"type":"Martial","roles":["Striker","Utility"],"s":{"melee":4,"ranged":4,"defenses":4,"magic":1,"support":2,"healing":1,"skills":3,"questing":3,"popularity":2,"difficulty":2},"en":{"name":"Ranger","src":"Player Core","rarity":"Common","hp":"10","key":"Strength or Dexterity","cast":"Optional primal focus spells","armor":"Light &amp; medium","sub":"Hunter's Edge","tag":"Mark one foe and become specifically, deliberately good at killing it.","mech":["<span class=\"act\">&#9670;</span> <b>Hunt Prey</b> designates a target, granting tracking and Perception bonuses against it. Nearly every ranger feature keys off that mark.","Your <b>Hunter's Edge</b> decides what the mark buys: <b>Flurry</b> slashes your multiple attack penalty, <b>Precision</b> adds heavy damage to your first hit each round, <b>Outwit</b> trades damage for skills and AC against your prey.","You get the <b>best all-around saves of any martial</b> &mdash; expert Fortitude and Reflex from 1st level.","Terrain mastery is the quiet strength: ignoring difficult terrain, moving untrackably, and a real edge in the wilderness.","<b>Animal companions</b> and <b>snares</b> are the two big optional branches, and warden spells add a light primal focus layer if you want one."],"rp":["Rangers live at the boundary between civilisation and wilderness, and take real pride in the practical, hands-on knowledge that comes with it.","Some protect the wild from encroaching settlements; others protect settlements from what the wild produces. Either way you are who gets called.","Hunt Prey creates focus as a character trait: a ranger notices one thing in a room and gives it their whole attention."],"dt":"Rangers craft weapons and train animals in preparation for the next trip out, but they are as often outdoors as settled &mdash; going on hunts, or scouting nearby land to understand it before it becomes a problem.","yes":"You want a strong, low-friction martial with real exploration utility and an optional animal companion.","no":"You want to be equally good against everything at once. The ranger is at its best pointed at one target."},"es":{"name":"Explorador","src":"Player Core","rarity":"Común","hp":"10","key":"Fuerza o Destreza","cast":"Conjuros de enfoque primigenios opcionales","armor":"Ligera y media","sub":"Ventaja del cazador","tag":"Marca a un enemigo y vuélvete específica y deliberadamente bueno en matarlo.","mech":["<span class=\"act\">&#9670;</span> <b>Cazar presa</b> designa un objetivo y te da bonificadores para rastrearlo y percibirlo. Casi todas las capacidades de la clase dependen de esa marca.","Tu <b>ventaja del cazador</b> decide qué compra la marca: <b>Ráfaga</b> recorta tu penalizador por ataque múltiple, <b>Precisión</b> añade mucho daño al primer impacto de cada asalto, <b>Ingenio</b> cambia daño por habilidades y CA frente a tu presa.","Tienes <b>las mejores salvaciones generales de cualquier marcial</b>: experto en Fortaleza y Reflejos desde nivel 1.","El dominio del terreno es la fuerza silenciosa: ignorar terreno difícil, moverte sin dejar rastro y una ventaja real en plena naturaleza.","Los <b>compañeros animales</b> y las <b>trampas</b> son las dos grandes ramas opcionales, y los conjuros de guardián añaden una capa primigenia ligera si la quieres."],"rp":["Los exploradores viven en la frontera entre civilización y naturaleza, y se enorgullecen del conocimiento práctico que eso trae.","Unos protegen lo salvaje de los asentamientos que avanzan; otros protegen a los asentamientos de lo que lo salvaje produce. En ambos casos, te llaman a ti.","Cazar presa crea concentración como rasgo de carácter: un explorador se fija en una sola cosa de la sala y le dedica toda su atención."],"dt":"Los exploradores fabrican armas y adiestran animales preparando la próxima salida, pero están tan a menudo al aire libre como asentados: saliendo de caza, o explorando las tierras cercanas para entenderlas antes de que se conviertan en un problema.","yes":"Quieres un marcial potente y sin fricción, con utilidad real en exploración y un compañero animal opcional.","no":"Quieres ser igual de bueno contra todo a la vez. El explorador da lo mejor de sí apuntado a un solo objetivo."}},{"id":"rogue","hb":0,"type":"Martial","roles":["Striker","Utility"],"s":{"melee":4,"ranged":3,"defenses":3,"magic":0,"support":3,"healing":0,"skills":5,"questing":5,"popularity":5,"difficulty":2},"en":{"name":"Rogue","src":"Player Core","rarity":"Common","hp":"8","key":"Dexterity (or another, via racket)","cast":"None","armor":"Light","sub":"Rogue's Racket","tag":"More skills than anyone, and damage that arrives the moment the enemy stops paying attention.","mech":["<b>Sneak Attack</b> adds precision damage whenever your target is off-guard, and <b>Debilitating Strike</b> follows up by hobbling or weakening them further.","Your <b>Racket</b> decides how you get targets off-guard and can even change your key attribute: Thief, Ruffian, Scoundrel, Eldritch Trickster and others.","You get <b>by far the most skill feats and skill increases</b> of any class. Out of combat, the rogue is the most capable character in Pathfinder.","Against a fresh, alert target your damage is lower than a barbarian's or fighter's &mdash; but your whole kit exists to make sure targets are rarely fresh or alert.","<b>Surprise Attack</b> means enemies start the first round off-guard, so you open every fight already switched on."],"rp":["Rogues thrive on risk and opportunity, and often skirt laws they see as pointless &mdash; usually by their own code rather than pure greed.","The racket is a job, not a morality: Mastermind, Scoundrel and Ruffian describe a strategist, a con artist and a leg-breaker.","People find you charming and useful in a pinch while suspecting, not always wrongly, that self-interest comes first."],"dt":"A rogue's downtime skews illicit &mdash; picking pockets, moving goods that are not strictly legal, staying plugged into the local underworld. Some formalise it by joining a thieves' guild, and the ambitious ones eventually found a guild of their own.","yes":"You want to be excellent outside combat, mobile inside it, and you enjoy setting up your own damage.","no":"You want damage with no prerequisites. Without an off-guard target the rogue's numbers fall off sharply."},"es":{"name":"Pícaro","src":"Player Core","rarity":"Común","hp":"8","key":"Destreza (u otro, según la especialidad)","cast":"Ninguno","armor":"Ligera","sub":"Especialidad de pícaro","tag":"Más habilidades que nadie, y daño que llega en cuanto el enemigo deja de prestar atención.","mech":["<b>Ataque furtivo</b> añade daño de precisión siempre que tu objetivo esté desprevenido, y <b>Golpe debilitante</b> remata entorpeciéndolo o debilitándolo todavía más.","Tu <b>especialidad</b> decide cómo dejas desprevenidos a los objetivos y puede incluso cambiar tu atributo clave: Ladrón, Matón, Bribón, Embaucador arcano y otras.","Obtienes <b>con diferencia las mayores dotes y aumentos de habilidad</b> de cualquier clase. Fuera del combate, el pícaro es el personaje más capaz de Pathfinder.","Contra un objetivo fresco y alerta tu daño es menor que el de un bárbaro o un guerrero, pero todo tu equipo existe para que los objetivos casi nunca estén frescos ni alerta.","<b>Ataque sorpresa</b> deja a los enemigos desprevenidos en el primer asalto, así que empiezas cada combate ya encendido."],"rp":["Los pícaros viven del riesgo y la oportunidad, y a menudo bordean o ignoran leyes que les parecen absurdas, normalmente según su propio código y no por pura codicia.","La especialidad es un oficio, no una moral: Cerebro, Bribón y Matón describen a un estratega, a un timador y a un rompepiernas.","La gente te encuentra encantador y útil en un apuro, mientras sospecha —no siempre sin razón— que tu interés propio va primero."],"dt":"El tiempo libre del pícaro tira hacia lo ilícito: aligerar bolsillos, mover mercancía no del todo legal, mantenerse enchufado al bajo mundo local. Algunos lo formalizan entrando en un gremio de ladrones, y los más ambiciosos acaban fundando el suyo.","yes":"Quieres ser excelente fuera del combate, móvil dentro de él, y disfrutas preparando tu propio daño.","no":"Quieres daño sin requisitos. Sin un objetivo desprevenido, los números del pícaro caen en picado."}},{"id":"runesmith","hb":0,"type":"Martial","roles":["Support","Striker","Controller"],"s":{"melee":3,"ranged":3,"defenses":3,"magic":1,"support":4,"healing":1,"skills":3,"questing":2,"popularity":2,"difficulty":3},"en":{"name":"Runesmith","src":"Impossible Magic","rarity":"Common","hp":"8","key":"Intelligence","cast":"None &mdash; runes, not spells","armor":"Light &amp; medium","sub":"Rune repertoire","tag":"Delayed-fuse magic: write runes across the battlefield, then speak their true names.","mech":["You apply <b>runes</b> two ways: <b>etched</b> runes are slow to place but lasting, <b>traced</b> runes are fast but fleeting. Both go on creatures or gear.","<span class=\"act\">&#9670;</span> <b>Invoke Rune</b> speaks a rune's true name and detonates it. Apply, then invoke, is the two-beat rhythm of every runesmith turn.","<b>Diacritics</b> let one rune modify another, so the depth of the class is in which runes you know and which combine well when invoked together.","Runes go on <b>allies as buffs</b> or <b>enemies as debuffs</b> through the same mechanic, making the runesmith a support class and a control class at once.","You are also the game's <b>rune-crafting specialist</b>, learning armour and weapon rune formulas automatically as you level &mdash; the party's equipment quietly becomes your department."],"rp":["Runes are language. You are literate in something older than the languages people speak, and using it means saying things that should not be said casually.","Equal parts scholar and artist, you are fascinated by the grammar and etymology of magical script and prone to dropping ancient words into ordinary conversation.","Others assume you are a full spellcaster rather than a craftsperson, and are just as likely to ask you to fix a broken clasp as to ask about magic."],"dt":"Runesmiths balance scholarly research into runic theory against the hands-on discipline of the craft &mdash; a morning composing something close to poetry about a rune's meaning, an afternoon hammering it out at the forge. Either way the understanding deepens a little each day.","yes":"You want a martial with a magical toolkit that helps allies and hinders enemies through one elegant mechanic.","no":"You want to hit things without a setup step. The runesmith spends actions preparing before it pays off."},"es":{"name":"Runista","src":"Impossible Magic","rarity":"Común","hp":"8","key":"Inteligencia","cast":"Ninguno — runas, no conjuros","armor":"Ligera y media","sub":"Repertorio de runas","tag":"Magia de mecha retardada: escribe runas por el campo de batalla y luego pronuncia sus nombres verdaderos.","mech":["Aplicas <b>runas</b> de dos maneras: las <b>grabadas</b> son lentas de colocar pero duraderas; las <b>trazadas</b> son rápidas pero efímeras. Ambas van sobre criaturas o equipo.","<span class=\"act\">&#9670;</span> <b>Invocar runa</b> pronuncia el nombre verdadero de una runa y la detona. Aplicar y luego invocar es el ritmo de dos tiempos de todo turno de runista.","Los <b>diacríticos</b> permiten que una runa modifique a otra, así que la profundidad está en qué runas conoces y cuáles combinan bien al invocarse juntas.","Las runas van sobre <b>aliados como mejoras</b> o sobre <b>enemigos como penalizaciones</b> con el mismo mecanismo, lo que te hace clase de apoyo y de control a la vez.","Además eres el <b>especialista en fabricar runas</b> del juego: aprendes automáticamente fórmulas de runas de armadura y arma al subir de nivel, y el equipo del grupo pasa a ser discretamente tu departamento."],"rp":["Las runas son lenguaje. Sabes leer algo más antiguo que los idiomas que habla la gente, y usarlo implica decir cosas que no deberían decirse a la ligera.","Mitad erudito, mitad artista: te fascina la gramática y la etimología de la escritura mágica y tiendes a soltar palabras antiguas en conversaciones normales.","Los demás dan por hecho que eres un lanzador completo y no un artesano, y es tan probable que te pidan arreglar un broche roto como que te pregunten por magia."],"dt":"Los runistas equilibran la investigación erudita sobre teoría rúnica con la disciplina manual del oficio: una mañana componiendo algo parecido a un poema sobre el significado de una runa, una tarde martilleándola en la fragua. En ambos casos, la comprensión se ahonda un poco cada día.","yes":"Quieres un marcial con una caja de herramientas mágica que ayuda a los aliados y estorba a los enemigos con un mismo mecanismo elegante.","no":"Quieres golpear sin un paso previo de preparación. El runista gasta acciones preparando antes de que rinda."}},{"id":"sorcerer","hb":0,"type":"Caster","roles":["Striker","Controller"],"s":{"melee":1,"ranged":4,"defenses":1,"magic":5,"support":3,"healing":3,"skills":2,"questing":4,"popularity":3,"difficulty":3},"en":{"name":"Sorcerer","src":"Player Core 2","rarity":"Common","hp":"6","key":"Charisma","cast":"Any tradition (spontaneous)","armor":"Unarmored","sub":"Bloodline","tag":"Magic in the blood: no spellbook, no deity, just more spells than anyone else.","mech":["You have the <b>largest spontaneous repertoire</b> in the game and <b>Signature Spells</b> to heighten favourites freely, giving you real flexibility despite a fixed daily list.","Your <b>Bloodline</b> &mdash; Draconic, Angelic, Demonic, Aberrant, Imperial, Undead and more &mdash; sets your spell tradition, so a sorcerer can be built to fill essentially any caster role.","<b>Blood magic</b> automatically triggers an extra rider whenever you cast a bloodline spell or sorcerous gift, so every cast is a little more than just a spell.","The bloodline also grants two bonus skills and its own focus spells.","<b>6 hit points per level</b>, no armour, and no martial fallback whatsoever. The highest ceiling for pure casting sits on the most exposed chassis in the game."],"rp":["Nobody taught you. Something in your ancestry is expressing itself through you, and it did not ask permission.","The bloodline shapes your whole self-image &mdash; embracing a draconic heritage with pride, or quietly worrying about a demonic one.","The class frames this as an ongoing tension: refine the gift toward mastery, or let it curdle toward ruin."],"dt":"Sorcerers craft magic items and scribe scrolls, but just as much downtime goes to the bloodline itself &mdash; researching their own ancestry, or seeking out the people and creatures connected to whatever runs in their blood.","yes":"You want to cast the most spells, adapt in the moment, and pick your tradition to suit the party.","no":"You want a large known-spell list or a durable body. Your repertoire is narrow and you are extremely fragile."},"es":{"name":"Hechicero","src":"Player Core 2","rarity":"Común","hp":"6","key":"Carisma","cast":"Cualquier tradición (espontánea)","armor":"Sin armadura","sub":"Linaje","tag":"Magia en la sangre: sin libro de conjuros, sin deidad, solo más conjuros que nadie.","mech":["Tienes el <b>mayor repertorio espontáneo</b> del juego y <b>conjuros distintivos</b> para intensificar tus favoritos con libertad, lo que te da flexibilidad real pese a una lista diaria fija.","Tu <b>linaje</b> —Dracónico, Angélico, Demoníaco, Aberrante, Imperial, No muerto y más— fija tu tradición de conjuros, así que un hechicero puede construirse para cubrir prácticamente cualquier papel de lanzador.","La <b>magia de sangre</b> dispara automáticamente un efecto añadido cada vez que lanzas un conjuro de linaje o un don hechiceril, de modo que cada lanzamiento es algo más que un conjuro.","El linaje concede además dos habilidades extra y sus propios conjuros de enfoque.","<b>6 puntos de golpe por nivel</b>, sin armadura y sin ningún recurso marcial. El techo más alto de lanzamiento puro sobre el chasis más expuesto del juego."],"rp":["Nadie te enseñó. Algo en tu ascendencia se está expresando a través de ti, y no pidió permiso.","El linaje modela tu imagen de ti mismo entera: abrazar con orgullo una herencia dracónica, o preocuparte en voz baja por una demoníaca.","La clase plantea esto como una tensión continua: refinar el don hacia la maestría, o dejar que se pudra hacia la ruina."],"dt":"Los hechiceros fabrican objetos mágicos y transcriben pergaminos, pero otro tanto del tiempo libre se va en el propio linaje: investigar su ascendencia, o buscar a las personas y criaturas ligadas a lo que sea que corra por su sangre.","yes":"Quieres lanzar la mayor cantidad de conjuros, adaptarte sobre la marcha y elegir tu tradición según el grupo.","no":"Quieres una lista amplia de conjuros conocidos o un cuerpo resistente. Tu repertorio es estrecho y eres extremadamente frágil."}},{"id":"summoner","hb":0,"type":"Hybrid","roles":["Striker","Defender"],"s":{"melee":3,"ranged":3,"defenses":3,"magic":3,"support":2,"healing":1,"skills":3,"questing":4,"popularity":1,"difficulty":5},"en":{"name":"Summoner","src":"Impossible Magic","rarity":"Common","hp":"10 (shared with eidolon)","key":"Charisma","cast":"Eidolon's tradition (spontaneous)","armor":"Light","sub":"Eidolon","tag":"Two characters, one hit point pool, and a single turn to split between them.","mech":["Your <b>eidolon</b> is not a pet but a co-equal partner. You share a <b>hit point pool</b>, a <b>multiple attack penalty</b>, and your senses.","You also share an <b>action economy</b>. Each round <b>Act Together</b> lets both of you contribute, and squeezing value out of that split is the entire skill of the class.","Your defences scale together through abilities like <b>Twin Juggernauts</b> and <b>Shared Resolve</b>, and you even share the benefits of magic items.","The eidolon's <b>type</b> &mdash; angel, beast, construct, dragon, demon, elemental, fey, plant, psychopomp, undead &mdash; sets its attacks, its senses, and your own spellcasting tradition.","Spellcasting is a garnish rather than a meal, and <b>evolution feats</b> upgrade the eidolon rather than you, so most of your growth happens to your partner."],"rp":["This is the only class that hands you a second character to voice. Partners, siblings, master and servant, or rivals stuck with each other &mdash; the relationship is the premise.","The bond visibly marks you with a sigil that cannot be hidden, so most people can tell the two of you are linked even without knowing what a summoner is.","Where did it come from, and does it want to be here? A summoner who has never answered that is leaving the best part of the class unused."],"dt":"Summoners use quiet stretches to learn more about their eidolon's nature, digging into the secrets of its magical tradition to pick up new spells, crafting items with the eidolon's help, or leaning on their own social skills to make useful allies for the pair of them.","yes":"You want a genuine partner character, and find the shared-action puzzle interesting rather than restrictive.","no":"You want to control one character efficiently. The summoner is the slowest class to take a turn with."},"es":{"name":"Invocador","src":"Impossible Magic","rarity":"Común","hp":"10 (compartidos con el eidolon)","key":"Carisma","cast":"Tradición de tu eidolon (espontánea)","armor":"Ligera","sub":"Eidolon","tag":"Dos personajes, una reserva de puntos de golpe y un único turno que repartir entre ambos.","mech":["Tu <b>eidolon</b> no es una mascota, sino un compañero de igual a igual. Compartís <b>reserva de puntos de golpe</b>, <b>penalizador por ataque múltiple</b> y sentidos.","También compartís <b>economía de acciones</b>. Cada asalto, <b>Actuar juntos</b> permite que ambos aportéis, y exprimir ese reparto es toda la destreza de la clase.","Vuestras defensas escalan a la vez mediante capacidades como <b>Juggernauts gemelos</b> y <b>Resolución compartida</b>, y hasta compartís los beneficios de los objetos mágicos.","El <b>tipo</b> del eidolon —ángel, bestia, constructo, dragón, demonio, elemental, feérico, planta, psicopompo, no muerto— fija sus ataques, sus sentidos y tu propia tradición de conjuros.","El lanzamiento es una guarnición, no el plato principal, y las dotes de <b>evolución</b> mejoran al eidolon y no a ti: casi todo tu crecimiento le ocurre a tu compañero."],"rp":["Es la única clase que te entrega un segundo personaje al que dar voz. Socios, hermanos, amo y sirviente, o rivales atrapados juntos: la relación es la premisa.","El vínculo te marca visiblemente con un sigilo que no se puede ocultar, así que casi cualquiera nota que estáis unidos aunque no sepa qué es un invocador.","¿De dónde salió, y quiere estar aquí? Un invocador que nunca ha respondido a eso está desaprovechando lo mejor de la clase."],"dt":"Los invocadores usan los ratos tranquilos para aprender más sobre la naturaleza de su eidolon, hurgando en los secretos de su tradición mágica para adquirir conjuros nuevos, fabricando objetos con su ayuda, o tirando de sus propias habilidades sociales para conseguir aliados útiles para los dos.","yes":"Quieres un compañero de verdad y el rompecabezas de acciones compartidas te resulta interesante en vez de limitante.","no":"Quieres manejar un solo personaje con eficiencia. El invocador es la clase más lenta a la hora de resolver un turno."}},{"id":"swashbuckler","hb":0,"type":"Martial","roles":["Striker","Utility"],"s":{"melee":4,"ranged":2,"defenses":4,"magic":0,"support":2,"healing":0,"skills":4,"questing":3,"popularity":3,"difficulty":3},"en":{"name":"Swashbuckler","src":"Player Core 2","rarity":"Common","hp":"10","key":"Dexterity","cast":"None","armor":"Light","sub":"Style","tag":"Earn panache by doing something stylish, then spend it to end the argument.","mech":["<b>Panache</b> must be earned every fight through a <b>bravado</b> action, and it evaporates the moment combat ends &mdash; there is no hoarding it between encounters.","Your <b>Style</b> decides how you earn it: Battledancer, Braggart, Fencer, Gymnast, Rascal or Wit. Because the generator is a skill check, you are always doing something interesting.","<b>Finishers</b> spend the panache on flashy attacks with big precision damage, and end your turn. The tension between spending and keeping is the class.","<span class=\"act\">&#8635;</span> <b>Opportune Riposte</b> punishes enemies who critically fumble against you, and your Speed climbs sharply while panache is up.","The tempo is genuinely different from other martials: a rhythm of style-actions into finishers rather than simply attacking every round."],"rp":["The swashbuckler is the only class where being stylish is a written rule &mdash; no flair, no damage.","That makes it the most performative class at the table, and a joy for a player who wants to talk during combat.","Others read the flair as magnetic charisma or insufferable arrogance depending on how well they know you, and consistently underestimate the threat until the blade finds them."],"dt":"Swashbucklers are as likely to be carousing in a tavern as maintaining gear and drilling new stunts. Those with a reputation worth protecting go further &mdash; building an organisation under their own name, or cultivating a following of admirers to keep the legend growing.","yes":"You want to describe your character doing something dashing every round and be mechanically rewarded for it.","no":"You want consistency. Earning panache can fail, and without it your damage drops noticeably."},"es":{"name":"Espadachín","src":"Player Core 2","rarity":"Común","hp":"10","key":"Destreza","cast":"Ninguno","armor":"Ligera","sub":"Estilo","tag":"Gánate el brío haciendo algo con estilo, y gástatelo en zanjar la discusión.","mech":["El <b>brío</b> hay que ganárselo en cada combate con una acción de <b>bravata</b>, y se evapora en cuanto el combate termina: no se acumula de un encuentro a otro.","Tu <b>estilo</b> decide cómo lo consigues: Bailarín de batalla, Fanfarrón, Esgrimidor, Gimnasta, Granuja o Ingenioso. Como el generador es una prueba de habilidad, siempre estás haciendo algo interesante.","Los <b>remates</b> gastan el brío en ataques vistosos con mucho daño de precisión, y terminan tu turno. La tensión entre gastarlo y conservarlo es la clase.","<span class=\"act\">&#8635;</span> <b>Réplica oportuna</b> castiga a los enemigos que fallan críticamente contra ti, y tu Velocidad sube mucho mientras tengas brío.","El tempo es genuinamente distinto al de otros marciales: un ritmo de acciones de estilo hacia remates en vez de simplemente atacar cada asalto."],"rp":["El espadachín es la única clase donde tener estilo es una regla escrita: sin garbo, no hay daño.","Eso lo convierte en la clase más teatral de la mesa, y en una delicia para quien quiera hablar durante el combate.","Los demás leen ese alarde como carisma magnético o como arrogancia insufrible según lo bien que te conozcan, y subestiman la amenaza hasta que la hoja los encuentra."],"dt":"Los espadachines están tan dispuestos a correrse una juerga en la taberna como a mantener el equipo y ensayar acrobacias nuevas. Los que tienen una reputación que proteger van más lejos: montan una organización con su nombre, o cultivan un séquito de admiradores que mantenga viva la leyenda.","yes":"Quieres describir a tu personaje haciendo algo gallardo cada asalto y que las reglas te lo recompensen.","no":"Quieres constancia. Ganar brío puede fallar, y sin él tu daño baja de forma notable."}},{"id":"thaumaturge","hb":0,"type":"Martial","roles":["Striker","Utility"],"s":{"melee":4,"ranged":3,"defenses":3,"magic":2,"support":3,"healing":1,"skills":4,"questing":4,"popularity":4,"difficulty":3},"en":{"name":"Thaumaturge","src":"Dark Archive","rarity":"Common","hp":"8","key":"Charisma","cast":"None &mdash; implements &amp; esoterica","armor":"Light &amp; medium","sub":"Implement","tag":"A monster hunter with a bag of superstitious junk, all of which turns out to work.","mech":["<span class=\"act\">&#9670;</span> <b>Exploit Vulnerability</b> uses Esoteric Lore to identify and then exploit a creature's specific weakness &mdash; and can improvise one against creatures that have no natural weak point at all.","Your <b>implements</b> &mdash; Amulet, Bell, Chalice, Lantern, Mirror, Regalia, Vial, Wand &mdash; each grant a passive benefit and an active action, and you gain more as you level.","<b>Implement's Empowerment</b> adds solid flat damage to your Strikes whenever you are holding an implement, which builds the signature look: weapon in one hand, strange object in the other.","Lore-based monster hunting is folded directly into the combat loop rather than sitting beside it as a Recall Knowledge side action.","It is the class built to answer \"how do I hurt this weird thing\", and it shines against exactly the threats other classes struggle with."],"rp":["You do not cast spells. You know that a mirror unsettles a doppelganger and a bell disturbs the dead, and you are extremely confident about it.","Thaumaturges see connections everywhere and treat the supernatural as a puzzle with a solution, even while bluffing through an explanation on the fly.","Allies turn to you the moment something uncanny appears; strangers mistake you for a wizard, missing that the power comes from scavenged trinkets and hard-won lore."],"dt":"Thaumaturges dig deeper into whatever supernatural mystery the last adventure turned up, checking how it might apply to the next. That means dusting off relics, cultivating herbs and forging new trinkets to restock esoterica &mdash; and calling in favours with the odd assortment of people, creatures and mystical forces they have befriended along the way.","yes":"You want an occult monster-hunter who is great at knowledge, great in a fight, and carries a lot of odd objects.","no":"You want simplicity. Between implements, esoterica and vulnerability tracking, the sheet and the turn are both busy."},"es":{"name":"Taumaturgo","src":"Dark Archive","rarity":"Común","hp":"8","key":"Carisma","cast":"Ninguno — instrumentos y esotérica","armor":"Ligera y media","sub":"Instrumento","tag":"Un cazador de monstruos con una bolsa de cachivaches supersticiosos, y todos funcionan.","mech":["<span class=\"act\">&#9670;</span> <b>Explotar vulnerabilidad</b> usa Saber esotérico para identificar y luego explotar la debilidad concreta de una criatura, y puede improvisar una contra criaturas que no tienen ningún punto débil natural.","Tus <b>instrumentos</b> —amuleto, campana, cáliz, linterna, espejo, regalía, vial, varita— conceden cada uno un beneficio pasivo y una acción activa, y vas sumando más al subir de nivel.","<b>Potenciación del instrumento</b> añade buen daño fijo a tus Ataques mientras sostengas un instrumento, lo que construye la estampa distintiva: arma en una mano, objeto extraño en la otra.","La caza de monstruos basada en saberes está integrada en el bucle de combate, y no al margen como una acción suelta de Recordar conocimiento.","Es la clase construida para responder a «¿cómo le hago daño a esta cosa rara?», y brilla justo contra las amenazas que a otras clases se les atragantan."],"rp":["No lanzas conjuros. Sabes que un espejo desconcierta a un doppelganger y que una campana perturba a los muertos, y lo afirmas con enorme seguridad.","Los taumaturgos ven conexiones por todas partes y tratan lo sobrenatural como un enigma con solución, incluso cuando se están inventando la explicación sobre la marcha.","Los aliados acuden a ti en cuanto aparece algo inquietante; los desconocidos te confunden con un mago y no ven que tu poder sale de baratijas rescatadas y saber ganado a pulso."],"dt":"Los taumaturgos ahondan en el misterio sobrenatural que sacó a la luz la última aventura, comprobando cómo podría aplicarse a la siguiente. Eso implica desempolvar reliquias, cultivar hierbas y forjar baratijas nuevas para reponer la esotérica, además de cobrarse favores del surtido variopinto de personas, criaturas y fuerzas místicas que han ido conociendo.","yes":"Quieres un cazador de monstruos ocultista que destaca en conocimiento, se defiende bien en combate y carga con muchos objetos raros.","no":"Quieres sencillez. Entre instrumentos, esotérica y seguimiento de vulnerabilidades, la hoja y el turno están igual de ocupados."}},{"id":"witch","hb":0,"type":"Caster","roles":["Controller","Support"],"s":{"melee":1,"ranged":3,"defenses":1,"magic":4,"support":5,"healing":2,"skills":3,"questing":2,"popularity":4,"difficulty":5},"en":{"name":"Witch","src":"Player Core","rarity":"Common","hp":"6","key":"Intelligence","cast":"Any tradition, set by patron (prepared)","armor":"Unarmored","sub":"Patron","tag":"Your familiar holds your magic, your patron supplies it, and neither will explain itself.","mech":["Your <b>familiar</b> is not flavour &mdash; it is the actual repository of your known spells, and you must consult it to prepare each day. Losing it, even temporarily, genuinely matters.","Your <b>Patron</b> &mdash; a fey lord, a hidden divinity, an ancient spirit &mdash; sets your spell tradition and communicates only through that familiar.","<b>Hexes</b> are the patron's direct interventions: potent focus spells, but strictly <b>one per turn</b> no matter how many actions you have left. The patron will not be pestered twice in a round.","<b>Lessons</b> are the class's feat spine, each teaching a hex and adding a spell to your list &mdash; they read like an actual arcane education.","You are a prepared caster with <b>6 hit points per level</b> and no armour: enormous control, minimal margin for error."],"rp":["Somebody is giving you this power and you may not know why, or who. The patron reveals itself only through omens and subtlety, never a clear conversation.","That uncertainty makes people nervous: is this power benevolent, unknowingly sinister, or something between? Most witches genuinely do not know either.","The familiar is a full character with a voice, and the constant companionship means you are never alone in a scene."],"dt":"Witches brew potions, craft magical items and hunt down new spells for the familiar to learn. Just as much energy goes to the larger mystery &mdash; working out the patron's aims and the nature of their own powers, or seeking out other witches for community and collaboration.","yes":"You want deep control magic, an all-day hex engine, and a familiar you will get genuinely attached to.","no":"You dislike single points of failure. Losing your familiar is a risk no other caster carries."},"es":{"name":"Bruja","src":"Player Core","rarity":"Común","hp":"6","key":"Inteligencia","cast":"Cualquier tradición, la fija el patrón (preparada)","armor":"Sin armadura","sub":"Patrón","tag":"Tu familiar guarda tu magia, tu patrón te la entrega, y ninguno de los dos se explica.","mech":["Tu <b>familiar</b> no es ambientación: es el depósito real de tus conjuros conocidos, y tienes que consultarlo para preparar cada día. Perderlo, aunque sea temporalmente, importa de verdad.","Tu <b>patrón</b> —un señor feérico, una divinidad oculta, un espíritu antiguo— fija tu tradición de conjuros y se comunica únicamente a través de ese familiar.","Los <b>maleficios</b> son las intervenciones directas del patrón: conjuros de enfoque potentes, pero estrictamente <b>uno por turno</b> por muchas acciones que te queden. Al patrón no se le importuna dos veces en un asalto.","Las <b>lecciones</b> son la columna de dotes de la clase: cada una enseña un maleficio y añade un conjuro a tu lista, y se leen como una educación arcana de verdad.","Eres un lanzador preparado con <b>6 puntos de golpe por nivel</b> y sin armadura: control enorme, margen de error mínimo."],"rp":["Alguien te está dando este poder y puede que no sepas por qué, ni quién. El patrón se revela solo mediante presagios y sutilezas, nunca en una conversación clara.","Esa incertidumbre pone nerviosa a la gente: ¿es este poder benévolo, siniestro sin saberlo, o algo intermedio? La mayoría de las brujas tampoco lo sabe.","El familiar es un personaje completo con voz propia, y la compañía constante hace que nunca estés a solas en una escena."],"dt":"Las brujas preparan pociones, fabrican objetos mágicos y persiguen conjuros nuevos para que los aprenda el familiar. Otro tanto de energía se va al misterio mayor: descifrar los fines del patrón y la naturaleza de sus propios poderes, o buscar a otras brujas por comunidad y colaboración.","yes":"Quieres magia de control profunda, un motor de maleficios para todo el día y un familiar al que le acabarás cogiendo cariño.","no":"Te disgustan los puntos únicos de fallo. Perder tu familiar es un riesgo que ningún otro lanzador arrastra."}},{"id":"wizard","hb":0,"type":"Caster","roles":["Controller","Utility"],"s":{"melee":1,"ranged":4,"defenses":1,"magic":5,"support":3,"healing":0,"skills":3,"questing":3,"popularity":2,"difficulty":5},"en":{"name":"Wizard","src":"Player Core","rarity":"Common","hp":"6","key":"Intelligence","cast":"Arcane (prepared)","armor":"Unarmored","sub":"School &amp; Thesis","tag":"The deepest spell collection in the game, and the right answer to anything &mdash; if you prepared it.","mech":["Your <b>spellbook</b> grows without limit. You add spells every level and can buy, copy or steal more, so a long campaign leaves you with options no other caster has.","Your <b>arcane school</b> grants bonus curriculum spells each day, or you take the flexible <b>school of unified magical theory</b> instead.","Your <b>arcane thesis</b> is a second, orthogonal choice &mdash; a signature research perk such as substituting prepared spells during the day or building around a staff.","<b>Drain Bonded Item</b> refunds one already-cast spell once per day from your arcane bonded item &mdash; a small but genuine safety net.","The arcane list is the widest in the game for damage, control and utility, and thin on healing. That is the trade."],"rp":["Wizardry is academic. You have a school, a teacher, a thesis and probably a rival, and Golarion's magical academies exist to be used for exactly this.","You cross-reference sources and view problems through your school's lens, sometimes to the point of genuine tunnel vision.","People find you impressive but unsettling, unsure whether a given spell is benign until it resolves &mdash; and assume you can magic away any mundane problem, from bad weather to a poor harvest."],"dt":"Wizards treat downtime as more schoolwork: learning new spells, crafting magic items, scribing scrolls for the party, and hunting down exciting formulas beyond spells alone. Some build lasting scholarly connections and eventually found a school or guild bearing their own name.","yes":"You want the deepest toolbox in the game and enjoy preparing for a day you cannot fully predict.","no":"You want to improvise. A wizard who prepares badly has a bad day, and 6 HP with no armour leaves no room for error."},"es":{"name":"Mago","src":"Player Core","rarity":"Común","hp":"6","key":"Inteligencia","cast":"Arcana (preparada)","armor":"Sin armadura","sub":"Escuela y tesis","tag":"La mayor colección de conjuros del juego, y la respuesta correcta a cualquier cosa: si la preparaste.","mech":["Tu <b>libro de conjuros</b> crece sin límite. Añades conjuros cada nivel y puedes comprar, copiar o robar más, así que una campaña larga te deja con opciones que ningún otro lanzador tiene.","Tu <b>escuela arcana</b> concede conjuros de currículo extra cada día, o eliges la flexible <b>escuela de teoría mágica unificada</b>.","Tu <b>tesis arcana</b> es una segunda elección independiente: una ventaja de investigación distintiva, como sustituir conjuros preparados durante el día o construirte alrededor de un báculo.","<b>Drenar objeto vinculado</b> te devuelve una vez al día un conjuro ya lanzado desde tu objeto de vínculo arcano: una red de seguridad pequeña pero real.","La lista arcana es la más amplia del juego en daño, control y utilidad, y escasa en curación. Ese es el intercambio."],"rp":["La magia del mago es académica. Tienes una escuela, un maestro, una tesis y probablemente un rival, y las academias mágicas de Golarion existen justo para esto.","Contrastas fuentes y miras los problemas por la lente de tu escuela, a veces hasta el punto de tener visión de túnel.","La gente te encuentra impresionante e inquietante a partes iguales, sin saber si un conjuro es benigno hasta que se resuelve, y da por hecho que puedes resolver por magia cualquier problema mundano, del mal tiempo a una mala cosecha."],"dt":"Los magos tratan el tiempo libre como más deberes: aprender conjuros nuevos, fabricar objetos mágicos, transcribir pergaminos para el grupo y perseguir fórmulas interesantes más allá de los propios conjuros. Algunos construyen relaciones académicas duraderas y acaban fundando una escuela o un gremio con su nombre.","yes":"Quieres la caja de herramientas más profunda del juego y disfrutas preparándote para un día que no puedes prever del todo.","no":"Quieres improvisar. Un mago que prepara mal tiene un mal día, y 6 puntos de golpe sin armadura no dejan margen de error."}},{"id":"saint","hb":1,"type":"Martial","roles":["Striker","Controller"],"s":{"melee":4,"ranged":3,"defenses":4,"magic":2,"support":2,"healing":0,"skills":1,"questing":2,"popularity":null,"difficulty":3},"en":{"name":"Saint","src":"Isaac's Homebrew &middot; guide v4","rarity":"Homebrew","hp":"10","key":"Strength or Dexterity","cast":"None &mdash; Cosmo Techniques (rankless focus spells)","armor":"The Cloth (medium); light &amp; unarmoured","sub":"Gold Cloth (12 signs)","tag":"An unarmed martial in a Gold Cloth whose power answers to the sky: solid most days, overwhelming on the day its constellation rises.","mech":["You fight with your fists &mdash; 1d6, agile and finesse, made magical with +1 damage per die by <b>Cosmo Strike</b> &mdash; inside <b>the Cloth</b>, a medium armour you summon or dismiss with one Interact action. Libra is the one Cloth that carries weapons.","<b>Techniques</b> are focus spells with no rank. You gain one at 1st, 6th, 11th and 16th, and each heightens every two levels, so your first never becomes dead weight. The pool is small: 1 Focus Point, 2 at 7th, 3 at 13th.","Your <b>Gold Cloth</b> is the subclass: twelve zodiac signs, each with a passive, its own four-Technique ladder and two boons &mdash; Aries' crystal walls and teleports, Scorpio's fifteen needles, Capricorn's crits that sever limbs, Libra's twelve weapons.","<b>Ascendant Constellation</b> is the engine. A world-wide <i>Sky</i> rolls one sign a day; on yours (1 day in 13) you gain your Ascendant Boon and your Techniques heighten as if you were 4 levels higher. On an Exalted day of your sign &mdash; the <b>Zenith</b> &mdash; it is 8 levels, and the GM can schedule one for an arc's climax.","The late features defy ordinary limits: <b>Sixth Sense</b> at 7th, <b>Seventh Sense</b> at 15th (burn your Cosmo to force your Zenith for a minute), and <b>Arayashiki</b> at 19th, which keeps you fighting for a minute after you have been killed."],"rp":["You are one of twelve sworn warriors of a goddess, and the gold on your back is a title as much as armour. Anyone who knows what it means treats you accordingly.","Your sign shapes how you fight and who you are: a Virgo fights with eyes closed, a Cancer speaks with the dead, a Gemini keeps two identities that nothing short of <i>true seeing</i> connects.","There is one Cloth per sign. Another Saint of your constellation is not an ally waiting to happen &mdash; they are a rival, and probably a campaign."],"dt":"Training the body that wears the Cloth, and tending the Cloth itself &mdash; an Aries Saint is the one who repairs everyone else's. Saints who take the sky feats also spend their downtime reading which day will next be theirs and arranging their lives, and their fights, around it.","yes":"You want a martial whose good days are spectacular, like your power tied to a calendar the whole table can see, and enjoy telegraphed big moments the GM can build an arc around.","no":"You want to be the strongest person at the table every session. On twelve days in thirteen you are a solid, slightly under-curve martial with one or two Techniques per fight.","est":"Not a Classfinder rating. Bars estimated for this codex from the guide, anchored on the <b>Monk</b> (unarmed, focus-fuelled martial) and the <b>Exemplar</b> (mythic martial with a daily-state engine), with the Champion's armour line. Popularity is not rated for homebrew."},"es":{"name":"Santo","src":"Homebrew de Isaac &middot; guía v4","rarity":"Homebrew","hp":"10","key":"Fuerza o Destreza","cast":"Ninguno — Técnicas de Cosmo (conjuros de enfoque sin rango)","armor":"La Armadura (media); ligera y sin armadura","sub":"Armadura de Oro (12 signos)","tag":"Un marcial sin armas dentro de una Armadura de Oro cuyo poder responde al cielo: sólido casi todos los días, abrumador el día que sale su constelación.","mech":["Peleas con los puños —1d6, ágiles y sutiles, mágicos y con +1 de daño por dado gracias al <b>Golpe de Cosmo</b>— dentro de <b>la Armadura</b>, una armadura media que invocas o despides con una acción de Interactuar. Libra es la única Armadura que lleva armas.","Las <b>Técnicas</b> son conjuros de enfoque sin rango. Ganas una a 1.º, 6.º, 11.º y 16.º nivel, y cada una se potencia cada dos niveles, así que la primera nunca se queda muerta. La reserva es pequeña: 1 Punto de Enfoque, 2 a 7.º, 3 a 13.º.","Tu <b>Armadura de Oro</b> es la subclase: doce signos del zodiaco, cada uno con un pasivo, su propia escalera de cuatro Técnicas y dos dones —los muros de cristal y teletransportes de Aries, las quince agujas de Escorpio, los críticos que cercenan miembros de Capricornio, las doce armas de Libra.","La <b>Constelación Ascendente</b> es el motor. Un <i>Cielo</i> común a todo el mundo saca un signo al día; en el tuyo (1 día de cada 13) ganas tu Don Ascendente y tus Técnicas se potencian como si tuvieras 4 niveles más. Un día Exaltado de tu signo —el <b>Cénit</b>— son 8 niveles, y el DJ puede programar uno para el clímax de un arco.","Los rasgos tardíos desafían los límites normales: el <b>Sexto Sentido</b> a 7.º, el <b>Séptimo Sentido</b> a 15.º (quemas tu Cosmo para forzar tu Cénit durante un minuto) y el <b>Arayashiki</b> a 19.º, que te mantiene luchando un minuto después de haber muerto."],"rp":["Eres uno de los doce guerreros jurados de una diosa, y el oro que llevas encima es un título tanto como una armadura. Quien sepa lo que significa te trata en consecuencia.","Tu signo moldea cómo luchas y quién eres: un Virgo pelea con los ojos cerrados, un Cáncer habla con los muertos, un Géminis mantiene dos identidades que sólo la <i>visión verdadera</i> puede unir.","Hay una Armadura por signo. Otro Santo de tu constelación no es un aliado en potencia: es un rival, y probablemente una campaña."],"dt":"Entrenar el cuerpo que lleva la Armadura y cuidar de la propia Armadura —el Santo de Aries es quien repara las de todos los demás—. Los Santos que eligen las dotes del cielo también dedican su tiempo libre a leer qué día será el suyo y a organizar su vida, y sus combates, en torno a él.","yes":"Quieres un marcial cuyos días buenos sean espectaculares, te gusta que tu poder esté atado a un calendario que toda la mesa puede ver y disfrutas de los grandes momentos anunciados en torno a los que el DJ puede construir un arco.","no":"Quieres ser la persona más fuerte de la mesa en cada sesión. Doce días de cada trece eres un marcial sólido, algo por debajo de la curva, con una o dos Técnicas por combate.","est":"No es una valoración de Classfinder. Barras estimadas para este códice a partir de la guía, ancladas en el <b>Monje</b> (marcial sin armas alimentado por enfoque) y el <b>Ejemplar</b> (marcial mítico con un motor de estado diario), con la línea de armadura del Campeón. La popularidad no se valora en el homebrew."}},{"id":"soulbound","hb":1,"type":"Martial","roles":["Striker","Defender","Controller"],"s":{"melee":4,"ranged":3,"defenses":3,"magic":2,"support":2,"healing":1,"skills":2,"questing":3,"popularity":null,"difficulty":3},"en":{"name":"Soulbound","src":"Isaac's Homebrew &middot; guide v1.4","rarity":"Homebrew","hp":"10","key":"Strength or Dexterity","cast":"None &mdash; Reiatsu techniques &amp; kid&omacr; (focus effects)","armor":"Light &amp; unarmoured","sub":"Lineage (3) &times; Spirit (15)","tag":"A warrior whose weapon is their own soul: sealed when the fight starts, released a moment later, and stronger every round the fight goes on.","mech":["Your <b>spirit weapon</b> is bonded and unbreakable, moves its runes for free, and cuts spirits as if it had <i>ghost touch</i>. Your first <span class=\"act\">&#9670;</span> <b>Release</b> each encounter costs no Reiatsu, and the released form lasts the whole fight.","<b>Reiatsu</b> is a focus pool (1, then 2 at 5th, 3 at 11th) with one genuinely new rule: <b>Rising Pressure</b> refunds a point the first time each round you hit or are hit, up to your pool size per encounter. Fights get better the longer they run &mdash; your best turn is never the first.","Two subclass axes. Your <b>Lineage</b> is what you are: a <b>Soul Reaper</b> with six chosen kid&omacr; and Zanjutsu sword arts, a <b>Hollow</b> with physical resistance, speed and fast healing, or a <b>Quincy</b> with a reishi bow, Blut and the power to suppress an enemy's release state. Your <b>Spirit</b> &mdash; fifteen, five per Lineage &mdash; is what your power looks like.","Every Spirit climbs a one-way ladder: Release at 1st, Refined at 9th, and at 13th a once-a-day, one-minute <b>Full Release</b> &mdash; Bankai, Segunda Etapa or Vollst&auml;ndig &mdash; that makes your Release Technique free every round and radiates fear.","<b>Kid&omacr;</b> are demon arts, not spells: damage, binding, a deliberately mediocre heal, a reactive shield. At 20th, <b>Final Release</b> trades a week without your powers for ten rounds of Severance and one finishing Art that weakens every round you wait."],"rp":["Three peoples, one war. A Soul Reaper's sword is a person with opinions; a Hollow ate its own heart and wears the hole; a Quincy owns no soul-weapon and makes a bow from the spirit particles in the air.","You are the party's specialist in the dead: you sense spirits through walls, strike the incorporeal without special gear, and can lay a haunting to rest by talking the soul into leaving.","Will is your soft save on purpose &mdash; the genre's defining failure is a whole army falling to one illusion &mdash; so expect to be the character the villain gets inside the head of."],"dt":"Training with, and arguing with, the spirit in your weapon &mdash; tables that run Full Release as a story unlock gate Bankai behind exactly that relationship &mdash; and answering the hauntings, possessions and lost souls that only a Kons&omacr; can settle.","yes":"You want an anime-shaped escalation &mdash; ordinary in round one, decisive by round four &mdash; and a subclass with a named, canon-grounded power and a personality inside it.","no":"You want your best turn at the start of the fight, or you don't want to read a two-axis subclass with fifteen options to choose your character.","est":"Not a Classfinder rating. Bars estimated for this codex from the guide, anchored on the <b>Magus</b> (weapon plus a magical toolkit, focused on alpha turns) and the <b>Barbarian</b> (an encounter-long release state), with the Monk's save shape. Popularity is not rated for homebrew."},"es":{"name":"Alma Vinculada","src":"Homebrew de Isaac &middot; guía v1.4","rarity":"Homebrew","hp":"10","key":"Fuerza o Destreza","cast":"Ninguno — técnicas de Reiatsu y kidō (efectos de enfoque)","armor":"Ligera y sin armadura","sub":"Linaje (3) × Espíritu (15)","tag":"Un guerrero cuya arma es su propia alma: sellada al empezar el combate, liberada un instante después y más fuerte con cada asalto que dura la pelea.","mech":["Tu <b>arma espiritual</b> está vinculada y es indestructible, traslada sus runas gratis y corta espíritus como si tuviera <i>toque fantasmal</i>. Tu primera <span class=\"act\">&#9670;</span> <b>Liberación</b> de cada encuentro no cuesta Reiatsu, y la forma liberada dura todo el combate.","El <b>Reiatsu</b> es una reserva de enfoque (1, luego 2 a 5.º, 3 a 11.º) con una regla realmente nueva: la <b>Presión Creciente</b> te devuelve un punto la primera vez de cada asalto que golpeas o te golpean, hasta el tamaño de tu reserva por encuentro. Los combates mejoran cuanto más duran: tu mejor turno nunca es el primero.","Dos ejes de subclase. Tu <b>Linaje</b> es lo que eres: un <b>Shinigami</b> con seis kidō a elegir y artes de espada Zanjutsu, un <b>Hollow</b> con resistencia física, velocidad y curación rápida, o un <b>Quincy</b> con un arco de reishi, Blut y el poder de suprimir la liberación de un enemigo. Tu <b>Espíritu</b> —quince, cinco por Linaje— es la forma que toma tu poder.","Cada Espíritu sube una escalera de un solo sentido: Liberación a 1.º, Refinada a 9.º y, a 13.º, una <b>Liberación Total</b> de un minuto, una vez al día —Bankai, Segunda Etapa o Vollständig— que hace gratuita tu Técnica de Liberación cada asalto e irradia miedo.","Los <b>kidō</b> son artes demoníacas, no conjuros: daño, ataduras, una curación mediocre a propósito, un escudo reactivo. A 20.º, la <b>Liberación Final</b> cambia una semana sin tus poderes por diez asaltos de Escisión y un único Arte final que se debilita con cada asalto que esperas."],"rp":["Tres pueblos, una guerra. La espada de un Shinigami es una persona con opiniones; un Hollow se comió su propio corazón y lleva el agujero; un Quincy no tiene arma del alma y se fabrica un arco con las partículas espirituales del aire.","Eres el especialista del grupo en los muertos: percibes espíritus a través de las paredes, golpeas lo incorpóreo sin equipo especial y puedes poner fin a una aparición convenciendo al alma de que se vaya.","La Voluntad es tu salvación débil a propósito —el fracaso que define al género es u
